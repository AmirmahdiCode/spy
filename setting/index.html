<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: flex-start; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .main-container {
            position: relative; z-index: 5;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 90px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .settings-card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .settings-title { font-size: 13px; font-weight: 800; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed var(--text-light); padding-bottom: 8px; }
        .settings-title i { color: var(--primary); }

        .font-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .font-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border: var(--border); border-radius: 8px;
            background: var(--bg2); cursor: pointer; box-shadow: 2px 2px 0 #000;
            font-size: 11px; font-weight: 700; color: var(--text);
            transition: all 0.2s ease;
        }
        .font-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .font-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .theme-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-option {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border: var(--border); border-radius: 8px;
            cursor: pointer; box-shadow: 2px 2px 0 #000; background: var(--bg2);
            transition: all 0.2s ease;
            flex: 1;
            min-width: 120px;
        }
        .theme-option:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .theme-option.active { background: var(--primary); border-color: var(--primary); }
        .theme-option.active .theme-option-label { color: #fff; }
        .theme-option i { font-size: 18px; color: var(--primary); width: 24px; text-align: center; }
        .theme-option.active i { color: #fff; }
        .theme-option-label { font-size: 11px; font-weight: 700; color: var(--dark); }

        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--bg3); }
        .setting-item:last-child { border-bottom: none; }
        .setting-item.disabled { opacity: 0.4; pointer-events: none; }
        .setting-info { display: flex; align-items: center; gap: 10px; }
        .setting-info i { font-size: 16px; color: var(--primary); width: 22px; text-align: center; }
        .setting-label { font-size: 11px; font-weight: 700; color: var(--dark); }
        .coming-soon-badge { font-size: 7px; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: var(--bg3); color: var(--text-light); border: var(--border); margin-right: 6px; }

        .toggle-switch {
            width: 40px; height: 22px; background: var(--bg3);
            border: var(--border); border-radius: 20px; cursor: pointer;
            position: relative; transition: all 0.3s ease; box-shadow: 2px 2px 0 #000; flex-shrink: 0;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; right: 20px;
            width: 14px; height: 14px; background: #fff;
            border: var(--border); border-radius: 50%; transition: all 0.3s ease;
        }
        .toggle-switch.active::after { right: 2px; }

        [dir="ltr"] .toggle-switch::after { left: 20px; right: auto; }
        [dir="ltr"] .toggle-switch.active::after { left: 2px; right: auto; }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .bottom-nav {
            position: fixed; bottom: 8px; right: 5%; left: 5%; width: 90%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 0; z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .bottom-nav {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            cursor: pointer; text-decoration: none; color: var(--text-light);
            padding: 4px 10px; font-family: var(--font); background: none; border: none; font-size: 12px;
        }
        .nav-item img {
            width: 20px; height: 20px;
            opacity: 0.5;
            filter: brightness(0);
        }
        [data-theme="dark"] .nav-item img {
            filter: brightness(0) invert(1);
        }
        .nav-item.active img {
            opacity: 1;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .nav-item span { font-size: 7px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="جاسوس مافیایی" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title">جاسوس مافیایی</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">

        <div class="settings-card">
            <div class="settings-title"><i class="bi bi-translate"></i> <span data-i18n="language">زبان</span></div>
            <div class="font-options">
                <button class="font-btn" data-lang="fa" onclick="setLanguage('fa')"> فارسی</button>
                <button class="font-btn" data-lang="ar" onclick="setLanguage('ar')"> العربية</button>
                <button class="font-btn" data-lang="en" onclick="setLanguage('en')"> English</button>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title"><i class="bi bi-fonts"></i> <span data-i18n="font">فونت</span></div>
            <div class="font-options">
                <button class="font-btn" data-font="Samim" style="font-family: 'Samim', Tahoma, sans-serif;" onclick="setFont('Samim')">صمیم</button>
                <button class="font-btn" data-font="Sahel" style="font-family: 'Sahel', Tahoma, sans-serif;" onclick="setFont('Sahel')">ساحل</button>
                <button class="font-btn" data-font="IRANSans" style="font-family: 'IRANSans', Tahoma, sans-serif;" onclick="setFont('IRANSans')">ایران‌سنس</button>
                <button class="font-btn" data-font="Vazirmatn" style="font-family: 'Vazirmatn', Tahoma, sans-serif;" onclick="setFont('Vazirmatn')">وزیرمتن</button>
                <button class="font-btn" data-font="Estedad" style="font-family: 'Estedad', Tahoma, sans-serif;" onclick="setFont('Estedad')">استعداد</button>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title"><i class="bi bi-palette"></i> <span data-i18n="theme">تم</span></div>
            <div class="theme-options">
                <div class="theme-option" data-special-theme="none" onclick="setSpecialTheme('none')">
                    <i class="bi bi-circle"></i>
                    <div><div class="theme-option-label" data-i18n="classic">کلاسیک</div></div>
                </div>
                <div class="theme-option" data-special-theme="crime" onclick="setSpecialTheme('crime')">
                    <i class="bi bi-droplet"></i>
                    <div><div class="theme-option-label" data-i18n="crime">جنایی</div></div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title"><i class="bi bi-moon-stars"></i> <span data-i18n="display_mode">حالت نمایش</span></div>
            <div class="theme-options">
                <div class="theme-option" data-theme-mode="light" onclick="setTheme('light')">
                    <i class="bi bi-sun"></i>
                    <div><div class="theme-option-label" data-i18n="light">حالت روشن</div></div>
                </div>
                <div class="theme-option" data-theme-mode="dark" onclick="setTheme('dark')">
                    <i class="bi bi-moon"></i>
                    <div><div class="theme-option-label" data-i18n="dark">حالت تاریک</div></div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title"><i class="bi bi-sliders"></i> <span data-i18n="other">سایر</span></div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-lightning-charge"></i>
                    <div><div class="setting-label" data-i18n="animation">انیمیشن‌ها</div></div>
                </div>
                <div class="toggle-switch active" id="animationToggle" onclick="toggleAnimation()"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-phone-vibrate"></i>
                    <div><div class="setting-label" data-i18n="haptic">لرزش</div></div>
                </div>
                <div class="toggle-switch active" id="hapticToggle" onclick="toggleHaptic()"></div>
            </div>
            <div class="setting-item disabled">
                <div class="setting-info">
                    <i class="bi bi-envelope"></i>
                    <div>
                        <div class="setting-label">
                            <span data-i18n="invite_messages">دریافت پیام دعوت</span>
                            <span class="coming-soon-badge" data-i18n="coming_soon">به زودی</span>
                        </div>
                    </div>
                </div>
                <div class="toggle-switch" id="inviteToggle"></div>
            </div>
        </div>

    </main>

    <div class="support-notification" id="supportNotification" onclick="openSupportLink()">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
        </div>
        <i class="bi bi-chevron-left"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='../dashboard/'"><img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه" draggable="false" oncontextmenu="return false;" ondragstart="return false;"><span data-i18n="home">خانه</span></div>
        <div class="nav-item" onclick="window.location.href='../ranking/'"><img src="https://uploadkon.ir/uploads/8c9f29_26medal-1st-iconbase.svg" alt="رتبه" draggable="false" oncontextmenu="return false;" ondragstart="return false;"><span data-i18n="ranking">رتبه</span></div>
        <div class="nav-item" onclick="window.location.href='../profile/'"><img src="https://uploadkon.ir/uploads/e78130_26profile-iconbase.svg" alt="پروفایل" draggable="false" oncontextmenu="return false;" ondragstart="return false;"><span data-i18n="profile">پروفایل</span></div>
        <div class="nav-item active" onclick="window.location.href='../setting/'"><img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات" draggable="false" oncontextmenu="return false;" ondragstart="return false;"><span data-i18n="settings_nav">تنظیمات</span></div>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var currentLang = 'fa';

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });

            var translations = {
                fa: {
                    language: 'زبان',
                    font: 'فونت',
                    theme: 'تم',
                    classic: 'کلاسیک',
                    crime: 'جنایی',
                    display_mode: 'حالت نمایش',
                    light: 'حالت روشن',
                    dark: 'حالت تاریک',
                    other: 'سایر',
                    animation: 'انیمیشن‌ها',
                    haptic: 'لرزش',
                    invite_messages: 'دریافت پیام دعوت',
                    coming_soon: 'به زودی',
                    home: 'خانه',
                    ranking: 'رتبه',
                    profile: 'پروفایل',
                    settings_nav: 'تنظیمات'
                },
                en: {
                    language: 'Language',
                    font: 'Font',
                    theme: 'Theme',
                    classic: 'Classic',
                    crime: 'Crime',
                    display_mode: 'Display Mode',
                    light: 'Light Mode',
                    dark: 'Dark Mode',
                    other: 'Other',
                    animation: 'Animations',
                    haptic: 'Haptic',
                    invite_messages: 'Receive Invite Messages',
                    coming_soon: 'Coming Soon',
                    home: 'Home',
                    ranking: 'Ranking',
                    profile: 'Profile',
                    settings_nav: 'Settings'
                },
                ar: {
                    language: 'اللغة',
                    font: 'الخط',
                    theme: 'المظهر',
                    classic: 'كلاسيكي',
                    crime: 'جريمة',
                    display_mode: 'وضع العرض',
                    light: 'وضع فاتح',
                    dark: 'وضع داكن',
                    other: 'أخرى',
                    animation: 'الحركات',
                    haptic: 'الاهتزاز',
                    invite_messages: 'استقبال رسائل الدعوة',
                    coming_soon: 'قريبًا',
                    home: 'الرئيسية',
                    ranking: 'الترتيب',
                    profile: 'الملف',
                    settings_nav: 'الإعدادات'
                }
            };

            var fontMap = {
                'Samim': "'Samim', Tahoma, sans-serif",
                'Sahel': "'Sahel', Tahoma, sans-serif",
                'IRANSans': "'IRANSans', Tahoma, sans-serif",
                'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
                'Estedad': "'Estedad', Tahoma, sans-serif"
            };

            function getSettings() {
                try {
                    var raw = localStorage.getItem('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' }; }
            }

            function saveSettings(s) { localStorage.setItem('mafiaSettings', JSON.stringify(s)); }

            function getTranslation(k) { var t = translations[currentLang] || translations.fa; return t[k] || translations.fa[k] || k; }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function applyFont(font) {
                var fontFamily = fontMap[font] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                document.querySelectorAll('.font-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.font === font); });
            }

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k]) el.textContent = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) { document.documentElement.setAttribute('data-animation', 'off'); }
                else { document.documentElement.removeAttribute('data-animation'); }
                applyFont(f);
                document.querySelectorAll('.theme-option[data-theme-mode]').forEach(function(b) { b.classList.toggle('active', b.dataset.themeMode === t); });
                document.querySelectorAll('.theme-option[data-special-theme]').forEach(function(b) { b.classList.toggle('active', b.dataset.specialTheme === st); });
                document.querySelectorAll('.font-btn[data-lang]').forEach(function(b) { b.classList.toggle('active', b.dataset.lang === s.language); });
                document.getElementById('animationToggle').classList.toggle('active', s.animation !== false);
                document.getElementById('hapticToggle').classList.toggle('active', s.haptic !== false);
                applyLanguage(s.language);
            }

            window.setLanguage = function(l) { var s = getSettings(); s.language = l; saveSettings(s); applyTheme(); triggerHaptic('light'); };
            window.setFont = function(f) { var s = getSettings(); s.font = f; saveSettings(s); applyTheme(); triggerHaptic('light'); };
            window.setTheme = function(t) { var s = getSettings(); s.theme = t; saveSettings(s); applyTheme(); triggerHaptic('light'); };
            window.setSpecialTheme = function(st) { var s = getSettings(); s.specialTheme = st; saveSettings(s); applyTheme(); triggerHaptic('light'); };
            window.toggleAnimation = function() { var s = getSettings(); s.animation = !s.animation; saveSettings(s); applyTheme(); triggerHaptic('light'); };
            window.toggleHaptic = function() { var s = getSettings(); s.haptic = !s.haptic; saveSettings(s); applyTheme(); if (s.haptic) triggerHaptic('medium'); };

            function openSupportLink(){
                if (webApp && webApp.openEitaaLink) { webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code'); }
                else { window.open('https://eitaa.com/Amirmahdi_code', '_blank'); }
            }
            window.openSupportLink = openSupportLink;

            if (webApp) {
                webApp.ready();
                webApp.expand();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() { window.location.href = '../dashboard/'; });
            }

            applyTheme();
            setTimeout(function() { var notif = document.getElementById('supportNotification'); if (notif) { notif.style.display = 'none'; } }, 5000);
        })();
    </script>
</body>
</html>
