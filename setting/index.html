<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات | جاسوس مافیایی</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f5;
      --bg3: #e0e0e0;
      --primary: #000000;
      --primary-dark: #333333;
      --primary-light: #666666;
      --primary-rgb: 0, 0, 0;
      --dark: #000000;
      --text: #333333;
      --text-light: #999999;
      --white: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e0e0e0;
      --shadow: 4px 4px 0 #000000;
      --radius: 12px;
      --border: 1px solid #000000;
      --header-bg: #ffffff;
      --footer-bg: #ffffff;
      --overlay: rgba(0, 0, 0, 0.05);
      --logo-filter: none;
      --font: 'Vazirmatn', Tahoma, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --bg2: #1a1a1a;
      --bg3: #333333;
      --primary: #ffffff;
      --primary-dark: #cccccc;
      --primary-light: #999999;
      --primary-rgb: 255, 255, 255;
      --dark: #ffffff;
      --text: #cccccc;
      --text-light: #666666;
      --white: #1a1a1a;
      --card-bg: #1a1a1a;
      --card-border: #333333;
      --header-bg: #1a1a1a;
      --footer-bg: #1a1a1a;
      --overlay: rgba(255, 255, 255, 0.05);
      --logo-filter: brightness(0) invert(1);
    }

    [data-special-theme="crime"] {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
      --overlay: rgba(220, 38, 38, 0.05);
    }

    [data-theme="dark"][data-special-theme="crime"] {
      --primary: #ef4444;
      --primary-dark: #dc2626;
      --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
      --overlay: rgba(239, 68, 68, 0.08);
    }

    [data-animation="off"] * { animation: none !important; transition: none !important; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    img {
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
    }

    .header {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }

    [data-theme="dark"] .header {
      background: rgba(26, 26, 26, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      border: none;
      box-shadow: none;
      flex-shrink: 0;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--dark);
    }

    .header-subtitle {
      font-size: 8px;
      color: var(--text-light);
    }

    .main-container {
      position: relative;
      z-index: 5;
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 16px auto;
      padding: 0 12px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-section {
      background: var(--card-bg);
      border: var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 3px 3px 0 #000000;
    }

    .setting-section-header {
      font-size: 12px;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--text-light);
      padding-bottom: 8px;
    }

    .setting-section-header i {
      color: var(--primary);
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--card-border);
    }

    .option-row:last-child {
      border-bottom: none;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--dark);
    }

    .option-label i {
      color: var(--primary);
    }

    .coming-soon-badge {
      font-size: 7px;
      font-weight: 700;
      background: var(--bg2);
      border: var(--border);
      border-radius: 10px;
      padding: 2px 8px;
      color: var(--text-light);
      margin-right: 4px;
    }

    .toggle-switch {
      width: 40px;
      height: 22px;
      background: var(--bg3);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      border: 1px solid #000000;
      flex-shrink: 0;
    }

    .toggle-switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      right: 2px;
      transition: all 0.3s ease;
    }

    .toggle-switch.active {
      background: var(--primary);
    }

    .toggle-switch.active::after {
      right: 20px;
    }

    .horizontal-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg2);
      cursor: grab;
    }

    .horizontal-scroll:active {
      cursor: grabbing;
    }

    .horizontal-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .horizontal-scroll::-webkit-scrollbar-track {
      background: var(--bg2);
      border-radius: 3px;
    }

    .horizontal-scroll::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }

    .scroll-option {
      min-width: 90px;
      max-width: 90px;
      padding: 10px;
      background: var(--bg2);
      border: var(--border);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .scroll-option:active {
      transform: scale(0.95);
    }

    .scroll-option.selected {
      background: var(--primary);
      border-color: var(--primary);
    }

    .scroll-option .option-icon {
      font-size: 18px;
      margin-bottom: 4px;
      display: block;
    }

    .scroll-option .option-name {
      font-size: 9px;
      font-weight: 700;
    }

    .scroll-option.selected .option-icon,
    .scroll-option.selected .option-name {
      color: #fff;
    }

    .theme-option {
      min-width: 110px;
      max-width: 110px;
      flex-shrink: 0;
      border: var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--card-bg);
      box-shadow: 2px 2px 0 #000000;
    }

    .theme-option:active {
      transform: scale(0.95);
    }

    .theme-option.selected {
      outline: 3px solid var(--primary-light);
    }

    .theme-preview {
      width: 100%;
      height: 70px;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #000000;
    }

    .theme-preview .preview-header {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }

    .theme-preview .preview-logo {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .theme-preview .preview-body {
      flex: 1;
      padding: 6px;
    }

    .theme-preview .preview-line {
      height: 6px;
      border-radius: 3px;
      margin-bottom: 4px;
    }

    .theme-name {
      padding: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--dark);
    }

    .bottom-nav {
      position: fixed;
      bottom: 8px;
      right: 5%;
      left: 5%;
      width: 90%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 0;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] .bottom-nav {
      background: rgba(26, 26, 26, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-light);
      padding: 4px 10px;
      font-family: var(--font);
      background: none;
      border: none;
      font-size: 12px;
    }

    .nav-item img {
      width: 20px;
      height: 20px;
      opacity: 0.5;
      filter: brightness(0);
    }

    [data-theme="dark"] .nav-item img {
      filter: brightness(0) invert(1);
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item.active img {
      opacity: 1;
      animation: bounce 1.5s ease-in-out infinite;
    }

    .nav-item span {
      font-size: 7px;
      font-weight: 600;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (max-width: 480px) {
      .header-title { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="جاسوس مافیایی">
        </div>
        <div>
          <div class="header-title">جاسوس مافیایی</div>
          <div class="header-subtitle">تنظیمات بازی</div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-font"></i> فونت</div>
      <div class="horizontal-scroll" id="fontSelector">
        <div class="scroll-option" data-value="Samim">
          <span class="option-icon">آ</span>
          <span class="option-name">Samim</span>
        </div>
        <div class="scroll-option" data-value="Vazirmatn">
          <span class="option-icon">آ</span>
          <span class="option-name">Vazirmatn</span>
        </div>
        <div class="scroll-option" data-value="Sahel">
          <span class="option-icon">آ</span>
          <span class="option-name">Sahel</span>
        </div>
        <div class="scroll-option" data-value="IRANSans">
          <span class="option-icon">آ</span>
          <span class="option-name">IRANSans</span>
        </div>
        <div class="scroll-option" data-value="Estedad">
          <span class="option-icon">آ</span>
          <span class="option-name">Estedad</span>
        </div>
      </div>
    </div>

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-palette"></i> تم</div>
      <div class="horizontal-scroll" id="themeSelector">

        <div class="theme-option" data-special="none">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#000000,#333333);"></span>
              <span style="font-size:5px;color:#000000;">●</span>
            </div>
            <div class="preview-body" style="background:#f5f5f5;">
              <div class="preview-line" style="width:70%;background:#000000;"></div>
              <div class="preview-line" style="width:40%;background:#e0e0e0;"></div>
            </div>
          </div>
          <div class="theme-name">کلاسیک</div>
        </div>

        <div class="theme-option" data-special="crime">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#dc2626,#b91c1c);"></span>
              <span style="font-size:5px;color:#dc2626;">●</span>
            </div>
            <div class="preview-body" style="background:#fef2f2;">
              <div class="preview-line" style="width:70%;background:#dc2626;"></div>
              <div class="preview-line" style="width:40%;background:#fecaca;"></div>
            </div>
          </div>
          <div class="theme-name">جنایی</div>
        </div>

      </div>
    </div>

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-circle-half-stroke"></i> حالت نمایش</div>
      <div class="option-row">
        <span class="option-label"><i class="fa-solid fa-moon"></i> حالت تاریک</span>
        <div class="toggle-switch" id="darkToggle"></div>
      </div>
    </div>

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-sliders"></i> تنظیمات بیشتر</div>
      <div class="option-row">
        <span class="option-label"><i class="fa-solid fa-film"></i> انیمیشن ها</span>
        <div class="toggle-switch" id="animationToggle"></div>
      </div>
      <div class="option-row">
        <span class="option-label"><i class="fa-solid fa-mobile-screen"></i> لرزش لمسی</span>
        <div class="toggle-switch" id="hapticToggle"></div>
      </div>
      <div class="option-row">
        <span class="option-label"><i class="fa-solid fa-bell"></i> دریافت پیام <span class="coming-soon-badge">بزودی</span></span>
        <div class="toggle-switch" id="notificationToggle" style="opacity:0.5;pointer-events:none;"></div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='../dashboard/';">
      <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه">
      <span>خانه</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../ranking/';">
      <img src="https://uploadkon.ir/uploads/8c9f29_26medal-1st-iconbase.svg" alt="رتبه">
      <span>رتبه</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../profile/';">
      <img src="https://uploadkon.ir/uploads/e78130_26profile-iconbase.svg" alt="پروفایل">
      <span>پروفایل</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='../setting/';">
      <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات">
      <span>تنظیمات</span>
    </div>
  </nav>

  <script>
    (function() {
      var webApp = window.Eitaa?.WebApp;
      var API_URL = 'https://script.google.com/macros/s/AKfycbwbp4ByhYBno6v5HKgGu2COkbu7zcmkyaRZ_eLKRJBn7JEHtcJ378O46ruUFPjogpFT/exec';

      var fontMap = {
        'Samim': "'Samim', Tahoma, sans-serif",
        'Sahel': "'Sahel', Tahoma, sans-serif",
        'IRANSans': "'IRANSans', Tahoma, sans-serif",
        'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
        'Estedad': "'Estedad', Tahoma, sans-serif"
      };

      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('dragstart', function(e) { e.preventDefault(); });
      document.addEventListener('copy', function(e) { e.preventDefault(); });
      document.addEventListener('cut', function(e) { e.preventDefault(); });

      function getSettings() {
        try {
          var raw = localStorage.getItem('mafiaSettings');
          if (!raw) return { theme: 'none', themeMode: 'light', animation: true, haptic: true, font: 'Vazirmatn' };
          var s = JSON.parse(raw);
          if (!s.theme) s.theme = 'none';
          if (!s.themeMode) s.themeMode = 'light';
          if (s.animation === undefined) s.animation = true;
          if (s.haptic === undefined) s.haptic = true;
          if (!s.font) s.font = 'Vazirmatn';
          return s;
        } catch(e) {
          return { theme: 'none', themeMode: 'light', animation: true, haptic: true, font: 'Vazirmatn' };
        }
      }

      function saveSettings(s) {
        localStorage.setItem('mafiaSettings', JSON.stringify(s));
      }

      function applyTheme(s) {
        document.documentElement.setAttribute('data-theme', s.themeMode);
        document.documentElement.setAttribute('data-special-theme', s.theme || 'none');
        var fontFamily = fontMap[s.font] || fontMap['Vazirmatn'];
        document.documentElement.style.setProperty('--font', fontFamily);
        document.body.style.fontFamily = fontFamily;
        if (s.animation === false) {
          document.documentElement.setAttribute('data-animation', 'off');
        } else {
          document.documentElement.removeAttribute('data-animation');
        }
      }

      var settings = getSettings();
      applyTheme(settings);

      function setupFontSelector() {
        var selector = document.getElementById('fontSelector');
        var options = selector.querySelectorAll('.scroll-option');
        options.forEach(function(opt) {
          if (opt.dataset.value === settings.font) opt.classList.add('selected');
          else opt.classList.remove('selected');
          opt.onclick = function() {
            options.forEach(function(o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            settings.font = opt.dataset.value;
            saveSettings(settings);
            applyTheme(settings);
            if (settings.haptic && webApp && webApp.HapticFeedback) {
              webApp.HapticFeedback.selectionChanged();
            }
          };
        });
      }

      function setupThemeSelector() {
        var selector = document.getElementById('themeSelector');
        var options = selector.querySelectorAll('.theme-option');
        options.forEach(function(opt) {
          if (opt.dataset.special === settings.theme) opt.classList.add('selected');
          else opt.classList.remove('selected');
          opt.onclick = function() {
            options.forEach(function(o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            settings.theme = opt.dataset.special;
            saveSettings(settings);
            applyTheme(settings);
            if (settings.haptic && webApp && webApp.HapticFeedback) {
              webApp.HapticFeedback.selectionChanged();
            }
          };
        });
      }

      function setupToggle(toggleId, key) {
        var toggle = document.getElementById(toggleId);
        toggle.classList.toggle('active', settings[key]);
        toggle.onclick = function() {
          settings[key] = !settings[key];
          saveSettings(settings);
          applyTheme(settings);
          toggle.classList.toggle('active', settings[key]);
          if (settings.haptic && webApp && webApp.HapticFeedback) {
            webApp.HapticFeedback.impactOccurred('light');
          }
        };
      }

      setupFontSelector();
      setupThemeSelector();
      setupToggle('darkToggle', 'themeMode');
      setupToggle('animationToggle', 'animation');
      setupToggle('hapticToggle', 'haptic');

      if (webApp) {
        webApp.ready();
        webApp.expand();
        webApp.BackButton.show();
        webApp.BackButton.onClick(function() {
          window.location.href = '../dashboard/';
        });
      }
    })();
  </script>
</body>
</html>
