<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت بازی جدید | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
            --font: 'Samim', Tahoma, sans-serif;
            --city-color: #10b981;
            --mafia-color: #ef4444;
            --free-color: #8b5cf6;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative; z-index: 5;
            flex: 1;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 110px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .section-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .section-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--text-light);
            padding-bottom: 8px;
        }
        .section-title i { color: var(--primary); font-size: 14px; }

        .sub-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub-label i { font-size: 11px; color: var(--primary); }

        .sub-divider {
            border: none;
            border-top: 1px dashed var(--text-light);
            margin: 14px 0;
            opacity: 0.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .options-grid.two { grid-template-columns: repeat(2, 1fr); }
        .options-grid.five { grid-template-columns: repeat(5, 1fr); }

        .option-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 4px;
            border: var(--border);
            border-radius: 10px;
            background: var(--bg2);
            cursor: pointer;
            font-family: var(--font);
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            box-shadow: 2px 2px 0 #000;
            transition: all 0.2s ease;
            position: relative;
            min-height: 60px;
        }
        .option-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .option-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .option-btn.active i { color: #fff; }
        .option-btn i { font-size: 16px; color: var(--primary); }
        .option-btn .option-label { font-size: 9px; font-weight: 800; text-align: center; }
        .option-btn .option-sub {
            font-size: 7px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            background: #f59e0b;
            color: #fff;
        }
        .option-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }
        .slider-row .slider-icon {
            font-size: 16px;
            color: var(--primary);
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .slider-row .slider-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
            flex: 1;
        }
        .slider-row .slider-value {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            min-width: 40px;
            text-align: center;
            background: var(--bg2);
            border: var(--border);
            border-radius: 8px;
            padding: 3px 8px;
            box-shadow: 2px 2px 0 #000;
        }
        .slider-input {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg3);
            border: var(--border);
            border-radius: 10px;
            outline: none;
            margin-top: 4px;
        }
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid #fff;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }
        .slider-input::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid #fff;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }

        .role-group {
            margin-bottom: 14px;
        }
        .role-group:last-child {
            margin-bottom: 0;
        }
        .role-group-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #fff;
        }
        .role-group-header i { font-size: 13px; }
        .role-group-header.city { background: var(--city-color); }
        .role-group-header.mafia { background: var(--mafia-color); }
        .role-group-header.free { background: var(--free-color); }

        .roles-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .role-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 10px;
            background: var(--bg2);
            box-shadow: 2px 2px 0 #000;
        }
        .role-row.locked {
            opacity: 0.5;
            pointer-events: none;
        }
        .role-row-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--primary);
            flex-shrink: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--primary);
        }
        .role-row-info {
            flex: 1;
            min-width: 0;
        }
        .role-row-name {
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .role-row-range {
            font-size: 8px;
            color: var(--text-light);
            margin-top: 2px;
        }
        .role-row-coming {
            font-size: 7px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            background: #f59e0b;
            color: #fff;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .counter-btn {
            width: 28px;
            height: 28px;
            border: var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000;
            transition: all 0.15s ease;
            padding: 0;
        }
        .counter-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .counter-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .counter-value {
            min-width: 24px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
        }

        .total-hint {
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            color: var(--text-light);
            margin-top: 14px;
        }
        .total-hint.error {
            color: #ef4444;
        }
        .total-hint .total-num {
            font-weight: 800;
            color: var(--primary);
            font-size: 11px;
        }
        .total-hint.error .total-num {
            color: #ef4444;
        }

        .floating-create-bar {
            position: fixed;
            bottom: 12px;
            right: 5%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            z-index: 998;
        }
        .btn-create {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: var(--primary);
            border: 1.5px solid var(--primary);
            border-radius: 25px;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] .btn-create {
            background: rgba(26, 26, 26, 0.35);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .btn-create::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
            pointer-events: none;
            border-radius: 25px 25px 0 0;
        }
        [data-theme="dark"] .btn-create::before {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
        }
        .btn-create:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.5);
        }
        [data-theme="dark"] .btn-create:active {
            background: rgba(26, 26, 26, 0.5);
        }
        .btn-create:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-create i { font-size: 15px; position: relative; z-index: 1; }
        .btn-create span { position: relative; z-index: 1; }
        .btn-create.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        .btn-create .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(var(--primary-rgb), 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            position: relative;
            z-index: 1;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                    <div class="header-subtitle" data-i18n="new_game">ساخت بازی جدید</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">

        <div class="section-card">
            <div class="section-title"><i class="bi bi-broadcast" aria-hidden="true"></i> <span data-i18n="game_setup">تنظیمات کلی بازی</span></div>

            <div class="sub-label"><i class="bi bi-broadcast" aria-hidden="true"></i> <span data-i18n="game_type">نوع بازی</span></div>
            <div class="options-grid" id="typeOptions">
                <button class="option-btn" data-type="local" type="button">
                    <i class="bi bi-phone" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="type_local">یک گوشی</span>
                </button>
                <button class="option-btn active" data-type="public" type="button">
                    <i class="bi bi-link-45deg" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="type_public">عمومی</span>
                </button>
                <button class="option-btn" data-type="server" type="button">
                    <i class="bi bi-wifi" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="type_server">سراسری</span>
                </button>
                <button class="option-btn disabled" data-type="private" type="button">
                    <i class="bi bi-lock" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="type_private">خصوصی</span>
                    <span class="option-sub" data-i18n="coming_soon">به‌زودی</span>
                </button>
            </div>

            <hr class="sub-divider">

            <div class="sub-label"><i class="bi bi-bar-chart" aria-hidden="true"></i> <span data-i18n="game_level">سطح بازی</span></div>
            <div class="options-grid five" id="levelOptions">
                <button class="option-btn active" data-level="beginner" type="button">
                    <i class="bi bi-star" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="level_beginner">مبتدی</span>
                </button>
                <button class="option-btn" data-level="normal" type="button">
                    <i class="bi bi-star-half" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="level_normal">معمولی</span>
                </button>
                <button class="option-btn" data-level="advanced" type="button">
                    <i class="bi bi-star-fill" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="level_advanced">پیشرفته</span>
                </button>
                <button class="option-btn" data-level="professional" type="button">
                    <i class="bi bi-trophy" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="level_professional">حرفه‌ای</span>
                </button>
                <button class="option-btn" data-level="legendary" type="button">
                    <i class="bi bi-gem" aria-hidden="true"></i>
                    <span class="option-label" data-i18n="level_legendary">افسانه‌ای</span>
                </button>
            </div>

            <hr class="sub-divider">

            <div class="sub-label"><i class="bi bi-clock" aria-hidden="true"></i> <span data-i18n="day_duration">مدت زمان هر روز</span></div>
            <div class="slider-row">
                <i class="bi bi-sun slider-icon" aria-hidden="true"></i>
                <span class="slider-label" data-i18n="day_minutes">دقیقه در هر روز</span>
                <span class="slider-value" id="dayDurationValue">۳</span>
            </div>
            <input type="range" min="1" max="5" value="3" step="1" class="slider-input" id="dayDurationSlider">

        </div>

        <div class="section-card">
            <div class="section-title"><i class="bi bi-people" aria-hidden="true"></i> <span data-i18n="players_and_roles">بازیکنان و نقش‌ها</span></div>

            <div class="sub-label"><i class="bi bi-people" aria-hidden="true"></i> <span data-i18n="player_count">تعداد نفرات</span></div>
            <div class="slider-row">
                <i class="bi bi-people slider-icon" aria-hidden="true"></i>
                <span class="slider-label" data-i18n="total_players">تعداد کل بازیکنان</span>
                <span class="slider-value" id="playerCountValue">۵</span>
            </div>
            <input type="range" min="3" max="10" value="5" step="1" class="slider-input" id="playerCountSlider">

            <hr class="sub-divider">

            <div class="sub-label"><i class="bi bi-person-badge" aria-hidden="true"></i> <span data-i18n="roles_config">انتخاب نقش‌ها</span></div>

            <div class="role-group">
                <div class="role-group-header city">
                    <i class="bi bi-buildings" aria-hidden="true"></i>
                    <span data-i18n="team_city">گروه شهر</span>
                </div>
                <div class="roles-list" id="cityRolesList"></div>
            </div>

            <div class="role-group">
                <div class="role-group-header mafia">
                    <i class="bi bi-mask" aria-hidden="true"></i>
                    <span data-i18n="team_mafia">گروه مافیا</span>
                </div>
                <div class="roles-list" id="mafiaRolesList"></div>
            </div>

            <div class="role-group">
                <div class="role-group-header free">
                    <i class="bi bi-person-fill-exclamation" aria-hidden="true"></i>
                    <span data-i18n="team_free">گروه آزاد</span>
                </div>
                <div class="roles-list" id="freeRolesList"></div>
            </div>

            <div class="total-hint" id="totalHint">
                <span data-i18n="total_selected">جمع انتخاب‌شده:</span>
                <span class="total-num"><span id="totalSelected">5</span> / <span id="totalRequired">5</span></span>
            </div>

        </div>

    </main>

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function escapeAttr(str) { return escapeHtml(str); }

            function safeSetLocalStorage(key, value) {
                try { localStorage.setItem(key, value); return true; }

            }

            function safeGetLocalStorage(key) {

                catch(e) { return null; }
            }

            function safeParseJSON(str, fallback) {

                    var parsed = JSON.parse(str);
                    return parsed === null || parsed === undefined ? fallback : parsed;
                } catch(e) { return fallback; }
            }

                    level_beginner: 'Beginner',

                    day_minutes: 'دقائق في اليوم',
                    total_selected: 'المجموع المختار:',
                    create_game: 'إنشاء لعبة',
                    creating: 'جار الإنشاء...',
                    type_local: 'هاتف واحد',
                    type_public: 'عام',
                    type_server: 'خادم',
                    type_private: 'خاص',
                    level_beginner: 'مبتدئ',
                    level_normal: 'عادي',
                    level_advanced: 'متقدم',
                    level_professional: 'محترف',
                    level_legendary: 'أسطوري',
                    team_city: 'مجموعة المدينة',
                    team_mafia: 'مجموعة المافيا',
                    team_free: 'مجموعة الأحرار',
                    role_citizen: 'مواطن',
                    role_detective: 'محقق',
                    role_judge: 'قاضي',
                    role_sheriff: 'شريف',
                    role_spy: 'جاسوس',
                    role_infiltrator: 'مندس',
                    role_silencer: 'مسكت',
                    role_bait: 'طعم',
                    role_killer: 'قاتل',
                    role_psycho: 'مختل',
                    coming_soon: 'قريباً',
                    range_format: '{min} إلى {max}',
                    fixed_one: 'بالضبط ۱',
                    create_failed: 'فشل إنشاء اللعبة. حاول مرة أخرى.',
                    error_network: 'يرجى التحقق من اتصالك بالإنترنت'
                }
            };

            function getTranslation(k) {
                var t = translations[currentLang] || translations.fa;
                return t[k] || translations.fa[k] || k;
            }

            function rangeText(min, max) {
                if (min === max) return getTranslation('fixed_one');
                var t = getTranslation('range_format');
                return t.replace('{min}', min).replace('{max}', max);
            }

            var ROLE_DEFS = {
                citizen: { nameKey: 'role_citizen', image: 'https://cdn.imgurl.ir/uploads/k79593_InShot_20260908_173316870.png', min: 1, max: 7, available: true, group: 'city' },
                detective: { nameKey: 'role_detective', image: 'https://cdn.imgurl.ir/uploads/w921252_InShot_20260908_173559430.png', min: 0, max: 1, available: true, group: 'city' },
                judge: { nameKey: 'role_judge', image: 'https://cdn.imgurl.ir/uploads/e372004_InShot_20260908_180057525.png', min: 1, max: 1, available: true, group: 'city' },
                sheriff: { nameKey: 'role_sheriff', image: '', min: 0, max: 1, available: false, group: 'city' },
                spy: { nameKey: 'role_spy', image: 'https://cdn.imgurl.ir/uploads/j86520_InShot_20260908_180252663.png', min: 1, max: 3, available: true, group: 'mafia' },
                infiltrator: { nameKey: 'role_infiltrator', image: 'https://cdn.imgurl.ir/uploads/g373296_InShot_20260908_180342640.png', min: 0, max: 7, available: true, group: 'mafia' },
                silencer: { nameKey: 'role_silencer', image: '', min: 0, max: 1, available: false, group: 'mafia' },
                bait: { nameKey: 'role_bait', image: '', min: 0, max: 1, available: false, group: 'mafia' },
                killer: { nameKey: 'role_killer', image: '', min: 0, max: 1, available: false, group: 'free' },
                psycho: { nameKey: 'role_psycho', image: '', min: 0, max: 1, available: false, group: 'free' }
            };

            var ROLE_GROUPS = {
                city: ['citizen', 'detective', 'judge', 'sheriff'],
                mafia: ['spy', 'infiltrator', 'silencer', 'bait'],
                free: ['killer', 'psycho']
            };

            var PRESETS = {
                3:  { spy: 1, infiltrator: 0, detective: 0, judge: 1, citizen: 1 },
                4:  { spy: 1, infiltrator: 0, detective: 1, judge: 1, citizen: 1 },
                5:  { spy: 1, infiltrator: 1, detective: 1, judge: 1, citizen: 1 },
                6:  { spy: 1, infiltrator: 1, detective: 1, judge: 1, citizen: 2 },
                7:  { spy: 1, infiltrator: 1, detective: 1, judge: 1, citizen: 3 },
                8:  { spy: 1, infiltrator: 2, detective: 1, judge: 1, citizen: 3 },
                9:  { spy: 2, infiltrator: 1, detective: 1, judge: 1, citizen: 4 },
                10: { spy: 2, infiltrator: 2, detective: 1, judge: 1, citizen: 4 }
            };

            var ACTIVE_ROLES = ['citizen', 'detective', 'judge', 'spy', 'infiltrator'];

            var state = {
                type: 'public',
                level: 'beginner',
                playerCount: 5,
                dayDuration: 3,
                roles: { citizen: 1, detective: 1, judge: 1, spy: 1, infiltrator: 1, sheriff: 0, silencer: 0, bait: 0, killer: 0, psycho: 0 }
            };

            function getSettings() {
                try {
                    var raw = safeGetLocalStorage('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = safeParseJSON(raw, null);
                    if (!p || typeof p !== 'object') throw new Error('bad');
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {
                    return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                }
            }

            function updateHeaderTitle(lang) {
                var titleEl = document.getElementById('headerTitle');
                if (!titleEl) return;
                titleEl.textContent = lang === 'en' ? 'Mafia Spy' : 'جاسوس مافیایی';
            }

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                updateHeaderTitle(lang);
                renderAllRolesLists();
                updateTotalBar();
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;
            }

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 15000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

            function renderRoleRow(key) {
                var def = ROLE_DEFS[key];
                if (!def) return '';

                var isLocked = !def.available;
                var currentVal = state.roles[key] || 0;

                var html = '<div class="role-row' + (isLocked ? ' locked' : '') + '" data-role="' + escapeAttr(key) + '">';

                if (def.image) {
                    html += '<img class="role-row-img" src="' + escapeAttr(def.image) + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                } else {
                    html += '<div class="role-row-img"><i class="bi bi-person" aria-hidden="true"></i></div>';
                }

                html += '<div class="role-row-info">';
                html += '<div class="role-row-name">';
                if (isLocked) {
                    html += '<span class="role-row-coming">' + escapeHtml(getTranslation('coming_soon')) + '</span> ';
                }
                html += escapeHtml(getTranslation(def.nameKey));
                html += '</div>';
                html += '<div class="role-row-range">' + escapeHtml(rangeText(def.min, def.max)) + '</div>';
                html += '</div>';

                if (!isLocked) {
                    html += '<div class="counter">';
                    html += '<button class="counter-btn" data-role-dec="' + escapeAttr(key) + '" type="button" aria-label="کاهش">−</button>';
                    html += '<span class="counter-value" id="role-val-' + escapeAttr(key) + '">' + currentVal + '</span>';
                    html += '<button class="counter-btn" data-role-inc="' + escapeAttr(key) + '" type="button" aria-label="افزایش">+</button>';
                    html += '</div>';
                } else {
                    html += '<div class="counter"><span class="counter-value">—</span></div>';
                }

                html += '</div>';
                return html;
            }

            function renderAllRolesLists() {
                var cityHtml = '';
                ROLE_GROUPS.city.forEach(function(k) { cityHtml += renderRoleRow(k); });
                var cityEl = document.getElementById('cityRolesList');
                if (cityEl) cityEl.innerHTML = cityHtml;

                var mafiaHtml = '';
                ROLE_GROUPS.mafia.forEach(function(k) { mafiaHtml += renderRoleRow(k); });
                var mafiaEl = document.getElementById('mafiaRolesList');
                if (mafiaEl) mafiaEl.innerHTML = mafiaHtml;

                var freeHtml = '';
                ROLE_GROUPS.free.forEach(function(k) { freeHtml += renderRoleRow(k); });
                var freeEl = document.getElementById('freeRolesList');
                if (freeEl) freeEl.innerHTML = freeHtml;
            }

            function updateRoleValueUI(roleKey) {
                var el = document.getElementById('role-val-' + roleKey);
                if (el) el.textContent = String(state.roles[roleKey] || 0);
            }

            function getAvailableTotal() {
                var total = 0;
                ACTIVE_ROLES.forEach(function(k) {
                    total += state.roles[k] || 0;
                });
                return total;
            }

            function updateCountersDisabled() {
                var total = getAvailableTotal();
                var needMore = state.playerCount - total;

                ACTIVE_ROLES.forEach(function(key) {
                    var def = ROLE_DEFS[key];
                    var val = state.roles[key] || 0;

                    var decBtn = document.querySelector('.counter-btn[data-role-dec="' + key + '"]');
                    var incBtn = document.querySelector('.counter-btn[data-role-inc="' + key + '"]');

                    if (decBtn) decBtn.disabled = (val <= def.min);
                    if (incBtn) incBtn.disabled = (val >= def.max || needMore <= 0);
                });
            }

            function updateTotalBar() {
                var total = getAvailableTotal();

                var totalSelEl = document.getElementById('totalSelected');
                var totalReqEl = document.getElementById('totalRequired');
                if (totalSelEl) totalSelEl.textContent = String(total);
                if (totalReqEl) totalReqEl.textContent = String(state.playerCount);

                var hint = document.getElementById('totalHint');
                if (hint) {
                    if (total !== state.playerCount) hint.classList.add('error');
                    else hint.classList.remove('error');
                }

                updateCountersDisabled();
                updateCreateButton();
            }

            function isConfigValid() {
                var total = getAvailableTotal();
                if (total !== state.playerCount) return false;
                if (state.playerCount < 3 || state.playerCount > 10) return false;

                for (var i = 0; i < ACTIVE_ROLES.length; i++) {
                    var def = ROLE_DEFS[ACTIVE_ROLES[i]];
                    var val = state.roles[ACTIVE_ROLES[i]] || 0;
                    if (val < def.min || val > def.max) return false;
                }

                return true;
            }

            function updateCreateButton() {
                var btn = document.getElementById('btnCreate');
                if (isCreating) return;
                btn.disabled = !isConfigValid();
            }

            function applyPreset() {
                var p = PRESETS[state.playerCount];
                if (!p) return;
                state.roles.citizen = p.citizen;
                state.roles.detective = p.detective;
                state.roles.judge = p.judge;
                state.roles.spy = p.spy;
                state.roles.infiltrator = p.infiltrator;
            }

            function refreshAllRolesUI() {
                ACTIVE_ROLES.forEach(function(k) {
                    updateRoleValueUI(k);
                });
                updateTotalBar();
            }

            function setType(t) {
                if (t === 'private') return;
                if (state.type === t) return;
                state.type = t;
                document.querySelectorAll('#typeOptions .option-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.type === t);
                });
                triggerHaptic('light');
            }

            function setLevel(l) {
                if (state.level === l) return;
                state.level = l;
                document.querySelectorAll('#levelOptions .option-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.level === l);
                });
                triggerHaptic('light');
            }

            function setPlayerCount(n) {
                n = parseInt(n, 10);
                if (isNaN(n) || n < 3 || n > 10) return;
                state.playerCount = n;
                document.getElementById('playerCountValue').textContent = String(n);
                document.getElementById('playerCountSlider').value = n;
                applyPreset();
                refreshAllRolesUI();
            }

            function setDayDuration(n) {
                n = parseInt(n, 10);
                if (isNaN(n) || n < 1 || n > 5) return;
                state.dayDuration = n;
                document.getElementById('dayDurationValue').textContent = String(n);
                document.getElementById('dayDurationSlider').value = n;
            }

            function incRole(key) {
                var def = ROLE_DEFS[key];
                if (!def || !def.available) return;

                var total = getAvailableTotal();
                if (total >= state.playerCount) return;
                if (state.roles[key] >= def.max) return;

                state.roles[key]++;
                updateRoleValueUI(key);
                updateTotalBar();
                triggerHaptic('light');
            }

            function decRole(key) {
                var def = ROLE_DEFS[key];
                if (!def || !def.available) return;
                if (state.roles[key] <= def.min) return;

                state.roles[key]--;
                updateRoleValueUI(key);
                updateTotalBar();
                triggerHaptic('light');
            }

            function buildGameData() {
                var roles = [];
                ['spy', 'infiltrator', 'detective', 'judge', 'citizen'].forEach(function(k) {
                    var count = state.roles[k] || 0;
                    for (var i = 0; i < count; i++) roles.push(k);
                });

                return {
                    type: state.type,
                    level: state.level,
                    playerCount: state.playerCount,
                    dayDuration: state.dayDuration,
                    roles: roles
                };
            }

            async function createGame() {
                if (isCreating) return;
                if (!isConfigValid()) {
                    triggerHaptic('heavy');
                    return;
                }

                if (state.type === 'local') {
                    var localData = buildGameData();
                    safeSetLocalStorage('mafiaLocalGame', JSON.stringify(localData));
                    triggerHaptic('medium');
                    window.location.href = '../game/local/';
                    return;
                }

                isCreating = true;
                var btn = document.getElementById('btnCreate');
                var originalHtml = btn.innerHTML;
                btn.classList.add('loading');
                btn.innerHTML = '<span class="btn-spinner"></span> <span>' + escapeHtml(getTranslation('creating')) + '</span>';

                var data = buildGameData();
                var result = await fetchData('createGame', data);

                if (result && result.ok && result.data && typeof result.data === 'object') {
                    var gameId = String(result.data.gameId || result.data.id || '');
                    if (gameId && VALID_GAME_ID.test(gameId)) {
                        safeSetLocalStorage('mafiaRoomCode', gameId);
                        triggerHaptic('medium');
                        window.location.href = '../game/waiting/?room=' + encodeURIComponent(gameId);
                        return;
                    }
                }

                btn.classList.remove('loading');
                btn.innerHTML = originalHtml;
                isCreating = false;

                var msg = getTranslation('create_failed');
                if (result && result.error === 'network') msg = getTranslation('error_network');
                if (webApp && webApp.showAlert) webApp.showAlert(msg);
                else alert(msg);
            }

            function openSupportLink() {
                var notif = document.getElementById('supportNotification');
                if (notif) notif.style.display = 'none';
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank', 'noopener,noreferrer');
                }
            }

            document.getElementById('typeOptions').addEventListener('click', function(e) {
                var btn = e.target.closest('.option-btn[data-type]');
                if (btn && !btn.classList.contains('disabled')) {
                    setType(btn.dataset.type);
                }
            });

            document.getElementById('levelOptions').addEventListener('click', function(e) {
                var btn = e.target.closest('.option-btn[data-level]');
                if (btn && !btn.classList.contains('disabled')) {
                    setLevel(btn.dataset.level);
                }
            });

            document.getElementById('playerCountSlider').addEventListener('input', function() {
                setPlayerCount(this.value);
            });

            document.getElementById('dayDurationSlider').addEventListener('input', function() {
                setDayDuration(this.value);
            });

            ['cityRolesList', 'mafiaRolesList', 'freeRolesList'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    el.addEventListener('click', function(e) {
                        var incBtn = e.target.closest('.counter-btn[data-role-inc]');
                        if (incBtn) {
                            incRole(incBtn.dataset.roleInc);
                            return;
                        }
                        var decBtn = e.target.closest('.counter-btn[data-role-dec]');
                        if (decBtn) {
                            decRole(decBtn.dataset.roleDec);
                        }
                    });
                }
            });

            document.getElementById('btnCreate').addEventListener('click', createGame);

            document.getElementById('supportNotification').addEventListener('click', openSupportLink);

            if (webApp) {
                try {
                    webApp.ready();
                    webApp.expand();
                    if (webApp.BackButton && webApp.BackButton.show) {
                        webApp.BackButton.show();
                        webApp.BackButton.onClick(function() { window.location.href = '../../dashboard/'; });
                    }
                } catch(e) {}
            }

            applyTheme();

            state.roles = { citizen: 1, detective: 1, judge: 1, spy: 1, infiltrator: 1, sheriff: 0, silencer: 0, bait: 0, killer: 0, psycho: 0 };
            state.type = 'public';
            setPlayerCount(5);
            setDayDuration(3);

            document.querySelectorAll('#typeOptions .option-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.type === 'public');
            });

            setTimeout(function() {
                var notif = document.getElementById('supportNotification');
                if (notif) notif.style.display = 'none';
            }, 5000);
        })();
    </script>
</body>
</html>
