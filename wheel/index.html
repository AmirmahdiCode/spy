<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 30%, var(--bg3) 60%, var(--bg2) 100%);
            background-size: 400% 400%;
            animation: gradientFlow 18s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.12;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            pointer-events: none;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            opacity: 1;
            animation: confettiFall 2s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .header-currency { display: flex; align-items: center; gap: 6px; }
        .currency-badge {
            display: flex; align-items: center; gap: 4px;
            background: var(--bg2); border: var(--border); border-radius: 8px;
            padding: 4px 10px; font-size: 10px; font-weight: 700;
            color: var(--dark); box-shadow: 2px 2px 0 #000;
            min-width: 50px;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .currency-badge.coins i { color: #f59e0b; }
        .currency-badge.diamonds i { color: #06b6d4; }
        .currency-badge.updated {
            animation: currencyPop 0.6s ease;
        }
        @keyframes currencyPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); background: var(--bg3); }
            100% { transform: scale(1); }
        }
        .mini-spinner {
            width: 12px; height: 12px;
            border: 2px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        .toast-container {
            position: fixed;
            top: 75px;
            right: 5%;
            left: 5%;
            max-width: 400px;
            margin: 0 auto;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #ef4444;
            color: #fff;
            border: 1px solid #b91c1c;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: toastIn 0.4s ease forwards;
        }
        .toast.hiding { animation: toastOut 0.4s ease forwards; }
        .toast i { font-size: 16px; flex-shrink: 0; }
        .toast .toast-text { flex: 1; line-height: 1.5; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        .main-container {
            position: relative; z-index: 5;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 100px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .wheel-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
            animation: wheelCardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        @keyframes wheelCardEnter {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .wheel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 6s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
        .wheel-card[data-wheel="beginner"] {
            border-color: var(--primary);
            box-shadow: var(--shadow), 0 0 20px rgba(var(--primary-rgb), 0.15);
        }
        .wheel-card[data-wheel="skilled"] {
            border-color: #10b981;
            box-shadow: 3px 3px 0 #000, 0 0 20px rgba(16, 185, 129, 0.25);
        }
        .wheel-card[data-wheel="skilled"] .wheel-header i { color: #10b981; }
        .wheel-card[data-wheel="pro"] {
            border-color: #06b6d4;
            box-shadow: 3px 3px 0 #000, 0 0 20px rgba(6, 182, 212, 0.25);
        }
        .wheel-card[data-wheel="pro"] .wheel-header i { color: #06b6d4; }
        .wheel-card[data-wheel="royal"] {
            border-color: #8b5cf6;
            box-shadow: 3px 3px 0 #000, 0 0 22px rgba(139, 92, 246, 0.3);
        }
        .wheel-card[data-wheel="royal"] .wheel-header i { color: #8b5cf6; }
        .wheel-card[data-wheel="imperial"] {
            border-color: #f59e0b;
            box-shadow: 3px 3px 0 #000, 0 0 25px rgba(245, 158, 11, 0.35);
        }
        .wheel-card[data-wheel="imperial"] .wheel-header i { color: #f59e0b; }

        .wheel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 14px;
            border-bottom: 1px dashed var(--text-light);
            padding-bottom: 10px;
            width: 100%;
            justify-content: center;
        }
        .wheel-header i {
            color: var(--primary);
            font-size: 15px;
            animation: headerIconBounce 2s ease-in-out infinite;
        }
        @keyframes headerIconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(8deg); }
        }

        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 16px;
        }

        .wheel-pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
            transition: transform 0.2s ease;
        }
        .wheel-pointer svg {
            width: 100%;
            height: 100%;
        }
        .wheel-pointer.vibrate {
            animation: pointerVibrate 0.1s linear infinite;
        }
        @keyframes pointerVibrate {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-4deg); }
            75% { transform: translateX(-50%) rotate(4deg); }
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--primary);
            transition: transform 4.5s cubic-bezier(.17,.67,.12,.99);
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.2),
                0 0 40px rgba(var(--primary-rgb), 0.15),
                inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--primary) 30%, var(--primary-dark) 100%);
            border: 3px solid var(--card-bg);
            border-radius: 50%;
            z-index: 4;
            box-shadow:
                0 0 0 4px var(--primary),
                0 4px 12px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(var(--primary-rgb), 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            animation: centerPulse 2.5s ease-in-out infinite;
        }
        @keyframes centerPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.06); }
        }

        .wheel-result {
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            min-height: 25px;
            margin-top: 8px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .wheel-result.success {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            animation: resultPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .wheel-result.empty {
            color: var(--text-light);
            animation: resultShake 0.5s ease;
        }
        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes resultShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .spin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            max-width: 260px;
            margin: 10px auto 0;
            padding: 11px 16px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 12px;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .spin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }
        .spin-btn:hover::before {
            left: 100%;
        }
        .spin-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .spin-btn:disabled { opacity: .5; cursor: not-allowed; }
        .spin-btn i {
            font-size: 14px;
            transition: transform 0.4s ease;
        }
        .spin-btn:hover i {
            transform: rotate(360deg);
        }
        .spin-btn.diamond-btn {
            background: var(--card-bg);
            color: var(--primary);
        }
        .spin-btn.diamond-btn i { color: #06b6d4; }

        .wheel-cost-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(var(--primary-rgb), 0.1);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 9px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            position: relative;
            animation: costBadgePulse 2.5s ease-in-out infinite;
        }
        @keyframes costBadgePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0.4);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(var(--primary-rgb), 0);
            }
        }
        .wheel-cost-badge i { font-size: 11px; }

        .wheel-card.processing { pointer-events: none; }
        .wheel-card.processing::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.65);
            border-radius: var(--radius);
            z-index: 50;
        }
        [data-theme="dark"] .wheel-card.processing::after { background: rgba(0, 0, 0, 0.65); }
        .wheel-card.processing::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            margin-top: -22px;
            margin-left: -22px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 51;
        }

        .confirm-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 3000;
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .confirm-overlay.show { display: flex; }
        .confirm-box {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 5px 5px 0 #000;
            text-align: center;
            max-width: 320px;
            width: 100%;
            animation: confirmBoxIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes confirmBoxIn {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .confirm-icon {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 10px;
            animation: confirmIconBounce 0.8s ease;
        }
        @keyframes confirmIconBounce {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .confirm-text { font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 8px; line-height: 1.7; }
        .confirm-cost { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btn {
            flex: 1; padding: 10px;
            border: var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 11px;
            font-weight: 700;
            box-shadow: 2px 2px 0 #000;
            transition: all .2s ease;
        }
        .confirm-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .confirm-btn.yes { background: #10b981; color: #fff; }
        .confirm-btn.no { background: var(--bg2); color: var(--text); }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bottom-nav {
            position: fixed; bottom: 8px; right: 5%; left: 5%; width: 90%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 0; z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .bottom-nav {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            cursor: pointer; text-decoration: none; color: var(--text-light);
            padding: 4px 10px; font-family: var(--font); background: none; border: none; font-size: 12px;
            transition: all 0.2s ease;
        }
        .nav-item:active { transform: scale(0.9); }
        .nav-item img {
            width: 20px; height: 20px;
            opacity: 0.5;
            filter: brightness(0);
        }

                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {

            function updateHeaderTitle(lang) {
                var titleEl = document.getElementById('headerTitle');

            function applyLanguage(lang) {

                document.querySelectorAll('[data-i18n]').forEach(function(el) {

                    if (t[k] !== undefined) el.textContent = t[k];

                if (lang === 'en') {

                updateHeaderTitle(lang);
                renderAllWheels();

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;

            function showToast(message, duration) {
                duration = duration || 4000;
                var container = document.getElementById('toastContainer');
                if (!container) return;

                var toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span class="toast-text">' + escapeHtml(message) + '</span>';

                setTimeout(function() {
                    toast.classList.add('hiding');
                    setTimeout(function() {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 400);
                }, duration);
            }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;
            }

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 15000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

                if (prize.labelKey) return getTranslation(prize.labelKey);

            function renderAllWheels() {
                var container = document.getElementById('wheelsContainer');

                var html = '';

            function drawWheel(key) {
                var canvas = document.getElementById('canvas-' + key);
                if (!canvas) return;
                var ctx = canvas.getContext('2d');
                var dpr = 2;
                canvas.width = 260 * dpr;
                canvas.height = 260 * dpr;
                ctx.scale(dpr, dpr);

                var cx = 260 / 2;
                var cy = 260 / 2;
                var radius = 260 / 2 - 4;
                var w = wheels[key];
                var seg = (2 * Math.PI) / w.prizes.length;
                var palette = getCurrentPalette();
                var isDark = getSettings().theme === 'dark';

                ctx.clearRect(0, 0, 260, 260);

                for (var i = 0; i < w.prizes.length; i++) {
                    var sa = i * seg;
                    var ea = sa + seg;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, sa, ea);
                    ctx.closePath();
                    ctx.fillStyle = palette[i % palette.length];
                    ctx.fill();

                    ctx.strokeStyle = isDark ? '#000' : '#000';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                var innerGrad = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius);
                innerGrad.addColorStop(0, 'rgba(255,255,255,0)');
                innerGrad.addColorStop(0.7, 'rgba(0,0,0,0)');
                innerGrad.addColorStop(1, 'rgba(0,0,0,0.25)');
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = innerGrad;
                ctx.fill();

                for (var j = 0; j < w.prizes.length; j++) {
                    var sa2 = j * seg;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(sa2 + seg / 2);

                    var fillColor = palette[j % palette.length];
                    var isDarkBg = fillColor === '#000000' || fillColor === '#222222' || fillColor === '#333333' || fillColor === '#444444' || fillColor === '#555555';
                    ctx.fillStyle = isDarkBg ? '#ffffff' : '#000000';
                    ctx.font = 'bold 11px Samim, Tahoma';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';

                    var labelText = getPrizeLabel(w.prizes[j]);
                    ctx.fillText(labelText, radius - 12, 0);

                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.lineWidth = 3;
                ctx.strokeStyle = isDark ? '#666666' : '#000000';
                ctx.stroke();

                var state = wheelStates[key];
                if (state && state.rotation) {
                    canvas.style.transform = 'rotate(' + state.rotation + 'deg)';
                }
            }

            function redrawAllWheels() {
                for (var k in wheels) {
                    drawWheel(k);
                }
            }

            function askSpin(key, payType) {
                if (isSpinning) return;
                var w = wheels[key];
                if (!w) return;

                var costText = getButtonCostText(w, payType);

                document.getElementById('confirmText').textContent = getTranslation('confirm_title');
                document.getElementById('confirmCost').textContent = costText;
                document.getElementById('confirmYes').textContent = getTranslation('yes');
                document.getElementById('confirmNo').textContent = getTranslation('no');
                document.getElementById('confirmOverlay').classList.add('show');
                pendingSpin = { key: key, payType: payType };
                triggerHaptic('light');
            }

            function closeConfirm() {
                document.getElementById('confirmOverlay').classList.remove('show');
                pendingSpin = null;
            }

            function setCardProcessing(key, processing) {
                var card = document.querySelector('.wheel-card[data-wheel="' + key + '"]');
                if (!card) return;
                if (processing) card.classList.add('processing');
                else card.classList.remove('processing');
            }

            function updateCurrencyBadge(el) {
                if (!el) return;
                el.classList.add('updated');
                setTimeout(function() { el.classList.remove('updated'); }, 700);
            }

            async function executeSpin(key, payType) {
                if (isSpinning) return;
                var w = wheels[key];
                if (!w) return;

                isSpinning = true;
                triggerHaptic('medium');

                var resultEl = document.getElementById('result-' + key);
                if (resultEl) {
                    resultEl.textContent = '';
                    resultEl.classList.remove('success', 'empty');
                }
                setCardProcessing(key, true);

                var response = await fetchData('spinWheel', { wheel: key, payType: payType });

                setCardProcessing(key, false);

                if (!response || !response.ok) {
                    var errMsg = getTranslation('error_spin');
                    if (response && response.error === 'Not enough coins') errMsg = getTranslation('not_enough');
                    else if (response && response.error === 'Not enough diamonds') errMsg = getTranslation('not_enough');
                    else if (response && response.error === 'network') errMsg = getTranslation('error_network');
                    if (resultEl) {
                        resultEl.textContent = errMsg;
                        resultEl.classList.add('empty');
                    }
                    isSpinning = false;
                    return;
                }

                var data = response.data;
                var prizeIndex = parseInt(data.prizeIndex, 10);
                if (isNaN(prizeIndex) || prizeIndex < 0 || prizeIndex >= w.prizes.length) {
                    if (resultEl) {
                        resultEl.textContent = getTranslation('error_spin');
                        resultEl.classList.add('empty');
                    }
                    isSpinning = false;
                    return;
                }

                var prize = w.prizes[prizeIndex];

                var newCoins = parseInt(data.coins, 10);
                if (!isNaN(newCoins)) {
                    var changed = newCoins !== userCoins;
                    userCoins = newCoins;
                    document.getElementById('coinsHeader').textContent = String(newCoins);
                    if (changed) updateCurrencyBadge(document.getElementById('coinsBadge'));
                }
                var newDiamonds = parseInt(data.diamonds, 10);
                if (!isNaN(newDiamonds)) {
                    var changed2 = newDiamonds !== userDiamonds;
                    userDiamonds = newDiamonds;
                    document.getElementById('diamondsHeader').textContent = String(newDiamonds);
                    if (changed2) updateCurrencyBadge(document.getElementById('diamondsBadge'));
                }

                var seg = 360 / w.prizes.length;
                var targetAngle = -90 - (prizeIndex * seg + seg / 2);
                var state = wheelStates[key] || { rotation: 0 };
                var currentAngle = state.rotation % 360;
                var delta = targetAngle - currentAngle;
                delta = ((delta % 360) + 360) % 360;
                var totalRotation = 1800 + delta;
                var newRotation = state.rotation + totalRotation;
                state.rotation = newRotation;
                wheelStates[key] = state;

                var canvas = document.getElementById('canvas-' + key);
                var pointer = document.querySelector('.wheel-card[data-wheel="' + key + '"] .wheel-pointer');
                if (canvas) {
                    canvas.style.transform = 'rotate(' + newRotation + 'deg)';
                }
                if (pointer) {
                    pointer.classList.add('vibrate');
                }

                setTimeout(function() {
                    if (pointer) pointer.classList.remove('vibrate');
                }, 4200);

                setTimeout(function() {
                    var resultText = '';
                    var cls = 'empty';
                    var isWin = false;
                    if (prize.type === 'empty') {
                        resultText = getTranslation('got_empty');
                        cls = 'empty';
                    } else if (prize.type === 'coins') {
                        resultText = '+' + prize.value + ' ' + getTranslation('coins');
                        cls = 'success';
                        isWin = true;
                    } else if (prize.type === 'diamonds') {
                        resultText = '+' + prize.value + ' ' + getTranslation('diamonds');
                        cls = 'success';
                        isWin = true;
                    } else if (prize.type === 'retry') {
                        resultText = getTranslation('got_retry');
                        cls = 'success';
                        isWin = true;
                    }
                    if (resultEl) {
                        resultEl.textContent = resultText;
                        resultEl.classList.add(cls);
                    }
                    if (isWin) {
                        triggerHaptic('heavy');
                        spawnConfetti();
                    } else {
                        triggerHaptic('medium');
                    }
                    isSpinning = false;
                }, 4400);
            }

            function openSupportLink() {
                var notif = document.getElementById('supportNotification');
                if (notif) notif.style.display = 'none';
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank', 'noopener,noreferrer');
                }
            }

            async function loadUserCurrency() {
                var coinsEl = document.getElementById('coinsHeader');
                var diamondsEl = document.getElementById('diamondsHeader');
                try {
                    var userData = await fetchData('getUser', {});
                    if (userData && userData.ok && userData.data && typeof userData.data === 'object') {
                        var c = parseInt(userData.data.coins, 10);
                        var d = parseInt(userData.data.diamonds, 10);
                        userCoins = isNaN(c) ? 0 : c;
                        userDiamonds = isNaN(d) ? 0 : d;
                        coinsEl.textContent = String(userCoins);
                        diamondsEl.textContent = String(userDiamonds);
                    } else {
                        coinsEl.textContent = '0';
                        diamondsEl.textContent = '0';
                    }
                } catch(e) {
                    coinsEl.textContent = '0';
                    diamondsEl.textContent = '0';
                }
            }

            document.getElementById('wheelsContainer').addEventListener('click', function(e) {
                var btn = e.target.closest('.spin-btn[data-wheel-key]');
                if (btn && !isSpinning) {
                    askSpin(btn.dataset.wheelKey, btn.dataset.payType);
                }
            });

            document.getElementById('confirmYes').addEventListener('click', function() {
                var pending = pendingSpin;
                pendingSpin = null;
                document.getElementById('confirmOverlay').classList.remove('show');
                if (pending) {
                    executeSpin(pending.key, pending.payType);
                }
            });

            document.getElementById('confirmNo').addEventListener('click', closeConfirm);

            document.getElementById('confirmOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeConfirm();
            });

            document.getElementById('supportNotification').addEventListener('click', openSupportLink);

            document.querySelectorAll('.nav-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var href = el.getAttribute('data-href');
                    if (href) window.location.href = href;
                });
            });

            async function init() {
                applyTheme();
                spawnParticles();

                if (webApp) {
                    try {
                        webApp.ready();
                        webApp.expand();
                        if (webApp.BackButton && webApp.BackButton.show) {
                            webApp.BackButton.show();
                            webApp.BackButton.onClick(function() { window.location.href = '../dashboard/'; });
                        }
                    } catch(e) {}
                }

                renderAllWheels();
                await loadUserCurrency();

                setTimeout(function() {
                    var notif = document.getElementById('supportNotification');
                    if (notif) notif.style.display = 'none';
                }, 5000);
            }

            init();
        })();
    </script>
</body>
</html>
