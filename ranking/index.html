<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رتبه‌بندی | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: flex-start; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .main-container {
            position: relative; z-index: 5;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 160px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: var(--border);
            border-radius: var(--radius);
            background: var(--card-bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 11px;
            box-shadow: var(--shadow);
            outline: none;
        }
        [dir="ltr"] .search-box input { padding: 10px 12px 10px 40px; }
        .search-box i {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            color: var(--text-light);
        }
        [dir="ltr"] .search-box i { right: auto; left: 12px; }

        .rank-list { display: flex; flex-direction: column; gap: 8px; }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .rank-item:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .rank-item.is-me { border-color: var(--primary); border-width: 2px; background: var(--bg2); }

        .rank-number {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-light);
            min-width: 30px;
            text-align: center;
        }
        .rank-number.gold { color: #f59e0b; font-size: 16px; }
        .rank-number.silver { color: #94a3b8; font-size: 16px; }
        .rank-number.bronze { color: #d97706; font-size: 16px; }

        .rank-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .rank-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .rank-info { flex: 1; min-width: 0; }
        .rank-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .rank-name .badge-icon {
            width: 13px; height: 13px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .rank-name .badge-icon img { width: 100%; height: 100%; object-fit: contain; }
        .rank-name .badge-icon i { font-size: 10px; color: #3b82f6; }
        .rank-score { font-size: 8px; color: var(--text-light); }

        .rank-badge-me {
            font-size: 7px;
            font-weight: 700;
            color: var(--primary);
            background: var(--bg2);
            padding: 2px 8px;
            border-radius: 10px;
            border: var(--border);
        }

        .section-loader {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .section-loader-spinner {
            width: 30px;
            height: 30px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .section-loader-text {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-light);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .my-rank-float {
            position: fixed;
            bottom: 60px;
            right: 5%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        [data-theme="dark"] .my-rank-float {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .my-rank-float .my-rank-number {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            min-width: 25px;
        }
        .my-rank-float .my-rank-avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--bg2);
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .my-rank-float .my-rank-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .my-rank-float .my-rank-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .my-rank-float .my-rank-name .badge-icon {
            width: 12px; height: 12px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .my-rank-float .my-rank-name .badge-icon img { width: 100%; height: 100%; object-fit: contain; }
        .my-rank-float .my-rank-name .badge-icon i { font-size: 9px; color: #3b82f6; }
        .my-rank-float .my-rank-score {
            font-size: 9px;
            font-weight: 800;
            color: var(--gold);
        }

        .profile-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile-modal-overlay.show { display: flex; }
        .profile-modal {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 5px 5px 0 #000;
            max-width: 400px;
            width: 100%;
            position: relative;
            text-align: center;
        }
        .profile-modal-close {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 28px;
            height: 28px;
            border: var(--border);
            border-radius: 50%;
            background: var(--bg2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-modal-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
            overflow: hidden;
        }
        .profile-modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-modal-name {
            font-size: 14px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .profile-modal-name .badge-icon {
            width: 15px; height: 15px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .profile-modal-name .badge-icon img { width: 100%; height: 100%; object-fit: contain; }
        .profile-modal-name .badge-icon i { font-size: 12px; color: #3b82f6; }
        .profile-modal-username { font-size: 9px; color: var(--text-light); direction: ltr; margin-bottom: 10px; }
        .profile-modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .profile-modal-stat {
            background: var(--bg2);
            border: var(--border);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 2px 2px 0 #000;
        }
        .profile-modal-stat-value { font-size: 14px; font-weight: 800; color: var(--dark); }
        .profile-modal-stat-label { font-size: 7px; color: var(--text-light); }

        .modal-loader {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .bottom-nav {
            position: fixed; bottom: 8px; right: 5%; left: 5%; width: 90%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 0; z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .bottom-nav {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            cursor: pointer; text-decoration: none; color: var(--text-light);
            padding: 4px 10px; font-family: var(--font); background: none; border: none; font-size: 12px;
        }
        .nav-item img {
            width: 20px; height: 20px;
            opacity: 0.5;
            filter: brightness(0);
        }
        [data-theme="dark"] .nav-item img {
            filter: brightness(0) invert(1);
        }
        .nav-item.active img {
            opacity: 1;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .nav-item span { font-size: 7px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        @media(max-width:480px) { .rank-list { gap: 6px; } }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="text" id="searchInput" placeholder="جستجوی کاربر..." data-i18n-placeholder="search_user">
        </div>
        <div class="section-loader" id="rankLoader">
            <div class="section-loader-spinner"></div>
            <div class="section-loader-text" data-i18n="loading_rankings">در حال دریافت رتبه‌ها...</div>
        </div>
        <div class="rank-list" id="rankList"></div>
    </main>

    <div class="my-rank-float" id="myRankFloat" style="display:none;">
        <span class="my-rank-number" id="myRankFloatNumber">-</span>
        <span class="my-rank-avatar" id="myRankFloatAvatar"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
        <span class="my-rank-name" id="myRankFloatName">...</span>
        <span class="my-rank-score" id="myRankFloatScore">0</span>
    </div>

    <div class="profile-modal-overlay" id="profileModalOverlay">
        <div class="profile-modal">
            <div class="profile-modal-close" id="btnCloseProfileModal"><i class="bi bi-x-lg" aria-hidden="true"></i></div>
            <div id="modalLoader" class="modal-loader"></div>
            <div id="modalContent" style="display:none;">
                <div class="profile-modal-avatar" id="modalAvatar"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
                <div class="profile-modal-name" id="modalName"></div>
                <div class="profile-modal-username" id="modalUsername"></div>
                <div class="profile-modal-stats">
                    <div class="profile-modal-stat"><div class="profile-modal-stat-value" id="modalScore">0</div><div class="profile-modal-stat-label" data-i18n="score">امتیاز</div></div>
                    <div class="profile-modal-stat"><div class="profile-modal-stat-value" id="modalCoins">0</div><div class="profile-modal-stat-label" data-i18n="coins">سکه</div></div>
                    <div class="profile-modal-stat"><div class="profile-modal-stat-value" id="modalDiamonds">0</div><div class="profile-modal-stat-label" data-i18n="diamonds">الماس</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="support-notification" id="supportNotification">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
        </div>
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" data-href="../dashboard/">
            <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="home">خانه</span>
        </div>
        <div class="nav-item active" data-href="../ranking/">
            <img src="https://uploadkon.ir/uploads/8c9f29_26medal-1st-iconbase.svg" alt="رتبه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="ranking">رتبه</span>
        </div>
        <div class="nav-item" data-href="../profile/">
            <img src="https://uploadkon.ir/uploads/e78130_26profile-iconbase.svg" alt="پروفایل" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="profile">پروفایل</span>
        </div>
        <div class="nav-item" data-href="../setting/">
            <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="settings_nav">تنظیمات</span>
        </div>
    </nav>

    <script>
        (function() {
            'use strict';

            var webApp = window.Eitaa && window.Eitaa.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbzJBOcNxa49vrlBYQmK9BWjZKtIth-M2yqyvYPW8V639Syi8VF3Te9QL05rW5tAmlG5/exec';
            var allRankings = [];
            var currentLang = 'fa';

            var VALID_USER_ID = /^[A-Za-z0-9_\-@.]{1,64}$/;

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function escapeAttr(str) { return escapeHtml(str); }

            function safeGetLocalStorage(key) {
                try { return localStorage.getItem(key); }
                catch(e) { return null; }
            }

            function safeParseJSON(str, fallback) {
                try {
                    var parsed = JSON.parse(str);
                    return parsed === null || parsed === undefined ? fallback : parsed;
                } catch(e) {
                    return fallback;
                }
            }

            var fontMap = {
                'Samim': "'Samim', Tahoma, sans-serif",
                'Sahel': "'Sahel', Tahoma, sans-serif",
                'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
                'Estedad': "'Estedad', Tahoma, sans-serif",
                'Gandom': "'Gandom', Tahoma, sans-serif"
            };

            var iconAvatars = {
                'icon_game': 'fa-gamepad', 'icon_trophy': 'fa-trophy', 'icon_star': 'fa-star',
                'icon_bolt': 'fa-bolt', 'icon_fire': 'fa-fire', 'icon_crown': 'fa-crown',
                'icon_medal': 'fa-medal', 'icon_ghost': 'fa-ghost',

            var allAvatarUrls = {
                'pack1_1': 'https://cdn.imgurl.ir/uploads/w54346_lIQr-ezB9TyDFznBX3EieIvKLKM-CdpmSV-OSA2l26jhWCDcIA.png',

                'pack1_4': 'https://cdn.imgurl.ir/uploads/w41443_xNi0R1rJosqzhzhbLnQzYQHn2fw-XhSRfdtbSTe4-1WdpJFA2w.png',
                'pack1_5': 'https://cdn.imgurl.ir/uploads/n160157_D0pfZYH_Qyviui_DHs7nz-Ov8ok-9QNBVHKnRPi3pACDH8ybJw.png',
                'pack1_6': 'https://cdn.imgurl.ir/uploads/z506541_xNi0R1rJosqzhzhbLnQzYQHn2fw-XhSRfdtbSTe4-1WdpJFA2w.png',
                'pack1_7': 'https://cdn.imgurl.ir/uploads/o90527_iXRzLE_NMWaY3YWS7NVyWsLAnKc-5FHSha4aSI-iAd9SZcXZuA.png',

                'pack1_10': 'https://cdn.imgurl.ir/uploads/n589870_n1TPqxlnhdfs8om-ovlEjYGgBIM-LwT9XNfyQQSttH7PhHi5iQ.png'
            };

            var translations = {
                fa: {
                    search_user: 'جستجوی کاربر...',
                    loading_rankings: 'در حال دریافت رتبه‌ها...',
                    no_users: 'کاربری یافت نشد',
                    score: 'امتیاز',
                    coins: 'سکه',

                    home: 'خانه',
                    ranking: 'رتبه',
                    profile: 'پروفایل',

                    you: 'شما',
                    error_loading: 'خطا در دریافت اطلاعات',
                    unknown_user: 'کاربر'
                },
                en: {
                    search_user: 'Search user...',
                    loading_rankings: 'Loading rankings...',
                    no_users: 'No users found',
                    score: 'Score',
                    coins: 'Coins',

                },

                    loading_rankings: 'جار تحميل الترتيب...',
                    no_users: 'لا يوجد مستخدمين',

            function getTranslation(k) {
                var t = translations[currentLang] || translations.fa;
                return t[k] || translations.fa[k] || k;
            }

            function getSettings() {
                try {
                    var raw = safeGetLocalStorage('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = safeParseJSON(raw, null);
                    if (!p || typeof p !== 'object') throw new Error('bad');
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {
                    return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                }
            }

            function updateHeaderTitle(lang) {
                var titleEl = document.getElementById('headerTitle');
                if (!titleEl) return;
                titleEl.textContent = lang === 'en' ? 'Mafia Spy' : 'جاسوس مافیایی';
            }

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n-placeholder');
                    if (t[k] !== undefined) el.placeholder = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                updateHeaderTitle(lang);
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;
            }

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 10000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

            function getAvatarHtml(avatarId) {
                if (!avatarId || avatarId === 'default') return '<i class="fa-solid fa-user" aria-hidden="true"></i>';
                if (iconAvatars[avatarId]) return '<i class="fa-solid ' + escapeAttr(iconAvatars[avatarId]) + '" aria-hidden="true"></i>';
                if (allAvatarUrls[avatarId]) return '<img src="' + escapeAttr(allAvatarUrls[avatarId]) + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                return '<i class="fa-solid fa-user" aria-hidden="true"></i>';
            }

            function getUserTypeBadge(userType) {
                if (userType === 'سازنده') {
                    return '<span class="badge-icon"><img src="https://cdn.imgurl.ir/uploads/h95014_InShot_20260909_113952033.png" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></span>';
                } else if (userType === 'توسعه دهنده') {
                    return '<span class="badge-icon"><i class="fa-solid fa-code" aria-hidden="true"></i></span>';
                }
                return '';
            }

            function getRankIcon(i) {
                if (i === 0) return '<i class="fa-solid fa-crown" style="color:#f59e0b;" aria-hidden="true"></i>';
                if (i === 1) return '<i class="fa-solid fa-medal" style="color:#94a3b8;" aria-hidden="true"></i>';
                if (i === 2) return '<i class="fa-solid fa-medal" style="color:#d97706;" aria-hidden="true"></i>';
                return '#' + (i + 1);
            }

            function getRankClass(i) {
                if (i === 0) return 'gold';
                if (i === 1) return 'silver';
                if (i === 2) return 'bronze';
                return '';
            }

            function isMe(item, myId) {
                if (!myId) return false;
                return String(item.user_id) === String(myId) || String(item.username) === String(myId);
            }

            function renderRankItem(item, index, myId) {
                var me = isMe(item, myId);
                var avatarField = item.avatar || 'default';
                var userType = item.user_type || '';
                var rawUserId = String(item.user_id || item.username || '');
                var safeUserId = escapeAttr(rawUserId);
                var displayName = escapeHtml(item.name || item.user_id || getTranslation('unknown_user'));
                var score = parseInt(item.score, 10);
                if (isNaN(score)) score = 0;

                return '<div class="rank-item' + (me ? ' is-me' : '') + '" data-user-id="' + safeUserId + '" role="button" tabindex="0">' +
                    '<div class="rank-number ' + getRankClass(index) + '">' + getRankIcon(index) + '</div>' +
                    '<div class="rank-avatar">' + getAvatarHtml(avatarField) + '</div>' +
                    '<div class="rank-info"><div class="rank-name">' + displayName + ' ' + getUserTypeBadge(userType) + '</div>' +
                    '<div class="rank-score">' + escapeHtml(getTranslation('score')) + ': ' + score + '</div></div>' +
                    (me ? '<span class="rank-badge-me">' + escapeHtml(getTranslation('you')) + '</span>' : '') +
                    '</div>';
            }

            function renderRankList(list, myId) {
                if (list.length === 0) {
                    return '<div class="section-loader"><div class="section-loader-text">' + escapeHtml(getTranslation('no_users')) + '</div></div>';
                }
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    html += renderRankItem(list[i], i, myId);
                }
                return html;
            }

            function findMyRank(list, myId) {
                if (!myId) return -1;
                for (var i = 0; i < list.length; i++) {
                    if (isMe(list[i], myId)) return i;
                }
                return -1;
            }

            function updateMyRankFloat(list, myId) {
                var myRank = findMyRank(list, myId);
                if (myRank < 0) return;
                var me = list[myRank];
                document.getElementById('myRankFloatNumber').textContent = '#' + (myRank + 1);
                document.getElementById('myRankFloatAvatar').innerHTML = getAvatarHtml(me.avatar || 'default');
                var displayName = escapeHtml(me.name || getTranslation('unknown_user'));
                document.getElementById('myRankFloatName').innerHTML = displayName + ' ' + getUserTypeBadge(me.user_type);
                var score = parseInt(me.score, 10);
                document.getElementById('myRankFloatScore').textContent = String(isNaN(score) ? 0 : score);
                document.getElementById('myRankFloat').style.display = 'flex';
            }

            async function loadRankings() {
                var loader = document.getElementById('rankLoader');
                var listEl = document.getElementById('rankList');

                try {
                    var result = await fetchData('getAllUsers', {});

                    if (result && result.ok && Array.isArray(result.data)) {
                        allRankings = result.data
                            .filter(function(item) { return item && typeof item === 'object'; })
                            .sort(function(a, b) {
                                var sa = parseInt(a.score, 10);
                                var sb = parseInt(b.score, 10);
                                if (isNaN(sa)) sa = 0;
                                if (isNaN(sb)) sb = 0;
                                return sb - sa;
                            });

                        var myId = getUserId();
                        loader.style.display = 'none';
                        listEl.innerHTML = renderRankList(allRankings, myId);
                        updateMyRankFloat(allRankings, myId);
                    } else {
                        loader.style.display = 'none';
                        listEl.innerHTML = '<div class="section-loader"><div class="section-loader-text">' + escapeHtml(getTranslation('no_users')) + '</div></div>';
                    }
                } catch(e) {
                    loader.style.display = 'none';
                    listEl.innerHTML = '<div class="section-loader"><div class="section-loader-text">' + escapeHtml(getTranslation('error_loading')) + '</div></div>';
                }
            }

            function filterRankings() {
                var q = document.getElementById('searchInput').value.toLowerCase().trim();
                var myId = getUserId();
                if (!q) {
                    document.getElementById('rankList').innerHTML = renderRankList(allRankings, myId);
                    return;
                }
                var filtered = allRankings.filter(function(item) {
                    var n = (item.name || '').toLowerCase();
                    var u = String(item.user_id || '').toLowerCase();
                    return n.indexOf(q) !== -1 || u.indexOf(q) !== -1;
                });
                document.getElementById('rankList').innerHTML = renderRankList(filtered, myId);
            }

            async function viewProfile(userId) {
                if (!userId || !VALID_USER_ID.test(userId)) return;

                var loader = document.getElementById('modalLoader');
                var content = document.getElementById('modalContent');
                loader.style.display = 'block';
                content.style.display = 'none';
                document.getElementById('profileModalOverlay').classList.add('show');

                var result = await fetchData('getUser', { username: userId });

                loader.style.display = 'none';
                content.style.display = 'block';

                if (result && result.ok && result.data && typeof result.data === 'object') {
                    var d = result.data;
                    document.getElementById('modalAvatar').innerHTML = getAvatarHtml(d.avatar || 'default');
                    var displayName = escapeHtml(d.name || getTranslation('unknown_user'));
                    document.getElementById('modalName').innerHTML = displayName + ' ' + getUserTypeBadge(d.user_type);
                    document.getElementById('modalUsername').textContent = 'ID: ' + escapeHtml(String(d.user_id || userId));
                    var sc = parseInt(d.score, 10);
                    var co = parseInt(d.coins, 10);
                    var di = parseInt(d.diamonds, 10);
                    document.getElementById('modalScore').textContent = String(isNaN(sc) ? 0 : sc);
                    document.getElementById('modalCoins').textContent = String(isNaN(co) ? 0 : co);
                    document.getElementById('modalDiamonds').textContent = String(isNaN(di) ? 0 : di);
                } else {
                    document.getElementById('modalName').textContent = getTranslation('error_loading');
                    document.getElementById('modalUsername').textContent = 'ID: ' + escapeHtml(userId);
                    document.getElementById('modalScore').textContent = '0';
                    document.getElementById('modalCoins').textContent = '0';
                    document.getElementById('modalDiamonds').textContent = '0';
                }
            }

            function closeProfileModal() {
                document.getElementById('profileModalOverlay').classList.remove('show');
            }

            function scrollToMyRank() {
                var items = document.querySelectorAll('.rank-item.is-me');
                if (items.length > 0) {
                    items[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function openSupportLink() {
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank', 'noopener,noreferrer');
                }
            }

            document.getElementById('searchInput').addEventListener('input', filterRankings);

            document.getElementById('rankList').addEventListener('click', function(e) {
                var item = e.target.closest('.rank-item');
                if (item && item.dataset.userId) {
                    viewProfile(item.dataset.userId);
                }
            });
            document.getElementById('rankList').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    var item = e.target.closest('.rank-item');
                    if (item && item.dataset.userId) {
                        e.preventDefault();
                        viewProfile(item.dataset.userId);
                    }
                }
            });

            document.getElementById('myRankFloat').addEventListener('click', scrollToMyRank);
            document.getElementById('btnCloseProfileModal').addEventListener('click', closeProfileModal);
            document.getElementById('profileModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeProfileModal();
            });
            document.getElementById('supportNotification').addEventListener('click', openSupportLink);

            document.querySelectorAll('.nav-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var href = el.getAttribute('data-href');
                    if (href) window.location.href = href;
                });
            });

            if (webApp) {
                try {
                    webApp.ready();
                    webApp.expand();
                    if (webApp.BackButton && webApp.BackButton.show) {
                        webApp.BackButton.show();
                        webApp.BackButton.onClick(function() { window.location.href = '../dashboard/'; });
                    }
                } catch(e) {}
            }

            applyTheme();
            loadRankings();

            setTimeout(function() {
                var notif = document.getElementById('supportNotification');
                if (notif) notif.style.display = 'none';
            }, 5000);
        })();
    </script>
