<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: flex-start; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .main-container {
            position: relative; z-index: 5;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 90px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .profile-content { display: flex; flex-direction: column; gap: 12px; }

        .section-loader {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .section-loader-spinner {
            width: 30px;
            height: 30px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .section-loader-text {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-light);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
        }
        .profile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .profile-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: #fff; border: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--primary); overflow: hidden; flex-shrink: 0; cursor: pointer;
        }
        .profile-avatar:active { transform: scale(.95); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name {
            font-size: 14px; font-weight: 800; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 6px;
        }
        .profile-name .badge-icon {
            width: 18px; height: 18px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .profile-name .badge-icon img { width: 100%; height: 100%; object-fit: contain; }
        .profile-name .badge-icon i { font-size: 14px; color: #3b82f6; }
        .profile-username { font-size: 9px; color: rgba(255,255,255,.7); direction: ltr; text-align: right; }
        [dir="ltr"] .profile-username { text-align: left; }
        .profile-actions-row { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,.2); padding-top: 12px; }
        .change-avatar-btn {
            flex: 2; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 8px; background: rgba(255,255,255,.2);
            border: 1px solid rgba(255,255,255,.4); border-radius: 8px;
            color: #fff; font-family: var(--font);
            font-size: 9px; font-weight: 700; cursor: pointer;
        }
        .badge {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
            background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #fff;
        }
        .badge .badge-value { font-size: 11px; font-weight: 800; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-card {
            background: var(--card-bg); border: var(--border); border-radius: var(--radius);
            padding: 16px; text-align: center; box-shadow: var(--shadow);
        }
        .stat-icon { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 800; color: var(--dark); }
        .stat-label { font-size: 8px; color: var(--text-light); }

        .achievements-card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .achievement-item {
            text-align: center; padding: 10px 4px; border: var(--border);
            border-radius: 8px; background: var(--bg2); box-shadow: 2px 2px 0 #000;
        }
        .achievement-icon { font-size: 20px; display: block; margin-bottom: 3px; }
        .achievement-name { font-size: 7px; font-weight: 700; color: var(--dark); }
        .achievement-item.locked { opacity: .3; filter: grayscale(1); }

        .games-history-card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .card-title {
            font-size: 13px; font-weight: 800; color: var(--dark); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px dashed var(--text-light); padding-bottom: 8px;
        }
        .card-title i { color: var(--primary); }
        .games-list { 
            display: flex; flex-direction: column; gap: 8px; max-height: 300px;
            overflow-y: auto; overflow-x: hidden; padding: 4px; margin: 0 -4px;
        }
        .game-item {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            border: var(--border); border-radius: 8px; background: var(--bg2); box-shadow: 2px 2px 0 #000;
            flex-shrink: 0;
        }
        .game-players { font-size: 9px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 4px; }
        .game-avatar {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--bg3); border: var(--border);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 10px; overflow: hidden; flex-shrink: 0;
        }
        .game-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .game-score { font-size: 9px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: var(--border); }
        .game-score.win { background: #10b981; color: #fff; }
        .game-score.loss { background: #ef4444; color: #fff; }

        .empty-state { text-align: center; padding: 16px; color: var(--text-light); font-size: 10px; }
        .empty-state i { font-size: 40px; color: var(--primary); margin-bottom: 8px; display: block; }

        .avatar-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.7); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .avatar-modal-overlay.show { display: flex; }
        .avatar-modal {
            background: var(--card-bg); border: var(--border); border-radius: var(--radius);
            padding: 16px; box-shadow: 5px 5px 0 #000;
            max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .avatar-modal-close {
            position: sticky; top: 0; float: left;
            width: 28px; height: 28px; border: var(--border); border-radius: 50%;
            background: var(--bg2); cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .avatar-modal-title { text-align: center; font-size: 14px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }
        .avatar-category { margin-bottom: 14px; }
        .avatar-category-title {
            font-size: 10px; font-weight: 800; color: var(--dark); margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .avatar-category-title .price-tag {
            font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            background: var(--bg2); border: var(--border); color: var(--dark);
        }
        .avatar-category-title .price-tag.free { background: #d1fae5; color: #059669; }
        .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .avatar-item {
            text-align: center; padding: 8px 4px; border: var(--border); border-radius: 8px;
            background: var(--bg2); cursor: pointer; transition: all .2s ease; box-shadow: 2px 2px 0 #000;
        }
        .avatar-item:active { transform: scale(.95); }
        .avatar-item.active { border-color: #f59e0b; border-width: 2px; }
        .avatar-item-img {
            width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 4px;
            background: #fff; border: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--primary); overflow: hidden;
        }
        .avatar-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-item-price { font-size: 7px; font-weight: 700; color: var(--text-light); }
        .avatar-item-price.free { color: #059669; }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .bottom-nav {
            position: fixed; bottom: 8px; right: 5%; left: 5%; width: 90%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 0; z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .bottom-nav {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            cursor: pointer; text-decoration: none; color: var(--text-light);
            padding: 4px 10px; font-family: var(--font); background: none; border: none; font-size: 12px;
        }
        .nav-item img {
            width: 20px; height: 20px;
            opacity: 0.5;
            filter: brightness(0);
        }
        [data-theme="dark"] .nav-item img {
            filter: brightness(0) invert(1);
        }
        .nav-item.active img {
            opacity: 1;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .nav-item span { font-size: 7px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        @media(max-width:480px) { .avatar-grid { grid-template-columns: repeat(4,1fr); } }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="profile-content" id="profileContent">
            <div class="section-loader" id="headerLoader">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading">در حال دریافت اطلاعات...</div>
            </div>

            <div class="profile-header-card" id="headerCard" style="display:none;">
                <div class="profile-top">
                    <div class="profile-avatar" id="profileAvatar" onclick="openAvatarModal()"><i class="fa-solid fa-user"></i></div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName"></div>
                        <div class="profile-username" id="profileUsername"></div>
                    </div>
                </div>
                <div class="profile-actions-row">
                    <button class="change-avatar-btn" onclick="openAvatarModal()"><i class="bi bi-camera"></i> <span data-i18n="change_avatar">تغییر آواتار</span></button>
                    <span class="badge"><i class="bi bi-star"></i> <span class="badge-value" id="scoreValue">0</span></span>
                </div>
            </div>

            <div class="section-loader" id="statsLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_stats">در حال دریافت آمار...</div>
            </div>

            <div class="stats-grid" id="statsGrid" style="display:none;">
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-star"></i></div>
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label" data-i18n="total_score">امتیاز کل</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-controller"></i></div>
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label" data-i18n="total_games">تعداد بازی</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-trophy"></i></div>
                    <div class="stat-value" id="totalWins">0</div>
                    <div class="stat-label" data-i18n="total_wins">تعداد برد</div>
                </div>
            </div>

            <div class="section-loader" id="achievementsLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_achievements">در حال دریافت افتخارات...</div>
            </div>

            <div class="achievements-card" id="achievementsCard" style="display:none;">
                <div class="card-title"><i class="bi bi-award"></i> <span data-i18n="achievements">افتخارات</span></div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="section-loader" id="historyLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_history">در حال دریافت تاریخچه...</div>
            </div>

            <div class="games-history-card" id="historyCard" style="display:none;">
                <div class="card-title"><i class="bi bi-clock-history"></i> <span data-i18n="game_history">تاریخچه بازی‌ها</span></div>
                <div class="games-list" id="gamesList"></div>
            </div>
        </div>
    </main>

    <div class="avatar-modal-overlay" id="avatarModalOverlay">
        <div class="avatar-modal">
            <div class="avatar-modal-close" onclick="closeAvatarModal()"><i class="bi bi-x-lg"></i></div>
            <div class="avatar-modal-title" data-i18n="select_avatar">انتخاب آواتار</div>
            <div id="avatarCategories"></div>
        </div>
    </div>

    <div class="support-notification" id="supportNotification" onclick="openSupportLink()">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
        </div>
        <i class="bi bi-chevron-left"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='../dashboard/'">
            <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="home">خانه</span>
        </div>
        <div class="nav-item" onclick="window.location.href='../ranking/'">
            <img src="https://uploadkon.ir/uploads/8c9f29_26medal-1st-iconbase.svg" alt="رتبه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="ranking">رتبه</span>
        </div>
        <div class="nav-item active" onclick="window.location.href='../profile/'">
            <img src="https://uploadkon.ir/uploads/e78130_26profile-iconbase.svg" alt="پروفایل" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="profile">پروفایل</span>
        </div>
        <div class="nav-item" onclick="window.location.href='../setting/'">
            <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="settings_nav">تنظیمات</span>
        </div>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbx_mJ5tDkGkwVhyGr5R_POJMBq2Y6AkI7HxJ82csk-NuaeFPl4sYm9COtlCoGFWnF7Y/exec';
            var currentAvatar = 'default', currentLang = 'fa';

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });

            var fontMap = {
                'Samim': "'Samim', Tahoma, sans-serif",
                'Sahel': "'Sahel', Tahoma, sans-serif",

            function getTranslation(k) {
                var t = translations[currentLang] || translations.fa;
                return t[k] || translations.fa[k] || k;
            }

            var avatarCategories = [
                {id:'icons', label:'icons', price:0, items:[
                    {id:'icon_game', icon:'fa-gamepad'}, {id:'icon_trophy', icon:'fa-trophy'},
                    {id:'icon_star', icon:'fa-star'}, {id:'icon_bolt', icon:'fa-bolt'},
                    {id:'icon_fire', icon:'fa-fire'}, {id:'icon_crown', icon:'fa-crown'},

                    {id:'icon_hat', icon:'fa-hat-wizard'}, {id:'icon_shield', icon:'fa-shield-halved'}
                ]}
            ];

            var allAchievements = [
                {id:'first_game', name:'first_game', icon:'🕹️'},
                {id:'10_games', name:'10_games', icon:'🎮'},

                {id:'10000_score', name:'10000_score', icon:'💫'},
                {id:'100000_score', name:'100000_score', icon:'☄️'}
            ];

            function getSettings() {
                try {
                    var raw = localStorage.getItem('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' }; }
            }

            function updateHeaderTitle(lang) {
                var titleEl = document.getElementById('headerTitle');
                if (lang === 'en') {
                    titleEl.textContent = 'Mafia Spy';
                } else {
                    titleEl.textContent = 'جاسوس مافیایی';
                }
            }

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k]) el.textContent = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                updateHeaderTitle(lang);
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) { document.documentElement.setAttribute('data-animation', 'off'); }
                else { document.documentElement.removeAttribute('data-animation'); }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return Promise.race([
                    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}),
                    new Promise(function(_,reject){setTimeout(function(){reject(new Error('timeout'));},10000);})
                ]).catch(function(){return{ok:false};});
            }

            function renderEmpty(text) {
                return '<div class="empty-state"><i class="bi bi-inbox"></i><p>' + text + '</p></div>';
            }

            function getAvatarHtml(avatarId) {
                if (!avatarId || avatarId === 'default') return '<i class="fa-solid fa-user"></i>';
                var found = null;
                avatarCategories.forEach(function(cat) {
                    cat.items.forEach(function(item) {
                        if (item.id === avatarId) found = item;
                    });
                });
                if (found) {
                    if (found.icon) return '<i class="fa-solid ' + found.icon + '"></i>';
                    if (found.url) return '<img src="' + found.url + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                }
                return '<i class="fa-solid fa-user"></i>';
            }

            function getUserTypeBadge(userType) {
                if (userType === 'سازنده') {
                    return '<span class="badge-icon"><img src="https://cdn.imgurl.ir/uploads/h95014_InShot_20260909_113952033.png" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></span>';
                } else if (userType === 'توسعه دهنده') {
                    return '<span class="badge-icon"><i class="fa-solid fa-code"></i></span>';
                }
                return '';
            }

            function renderAvatarModal() {
                var html = '';
                avatarCategories.forEach(function(cat) {
                    var catLabel = getTranslation(cat.label);
                    var priceText = cat.price === 0 ? getTranslation('free') : cat.price + ' 💎';
                    html += '<div class="avatar-category"><div class="avatar-category-title">' + catLabel + ' <span class="price-tag' + (cat.price === 0 ? ' free' : '') + '">' + priceText + '</span></div><div class="avatar-grid">';
                    cat.items.forEach(function(item) {
                        var isActive = currentAvatar === item.id;
                        var imgHtml = item.icon ? '<i class="fa-solid ' + item.icon + '"></i>' : '<img src="' + item.url + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                        var priceHtml = '<span class="avatar-item-price free">' + getTranslation('free') + '</span>';
                        html += '<div class="avatar-item' + (isActive ? ' active' : '') + '" onclick="selectAvatar(\'' + item.id + '\')">';
                        html += '<div class="avatar-item-img">' + imgHtml + '</div>' + priceHtml + '</div>';
                    });
                    html += '</div></div>';
                });
                document.getElementById('avatarCategories').innerHTML = html;
            }

            function openAvatarModal() {
                renderAvatarModal();
                document.getElementById('avatarModalOverlay').classList.add('show');
            }
            function closeAvatarModal() { document.getElementById('avatarModalOverlay').classList.remove('show'); }
            window.openAvatarModal = openAvatarModal;
            window.closeAvatarModal = closeAvatarModal;

            window.selectAvatar = function(itemId) {
                currentAvatar = itemId;
                fetchData('updateUser', {avatar: itemId});
                updateProfileAvatar();
                closeAvatarModal();
                triggerHaptic('light');
            };

            function updateProfileAvatar() {
                document.getElementById('profileAvatar').innerHTML = getAvatarHtml(currentAvatar);
            }

            function openSupportLink() {
                if (webApp && webApp.openEitaaLink) { webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code'); }
                else { window.open('https://eitaa.com/Amirmahdi_code', '_blank'); }
            }
            window.openSupportLink = openSupportLink;

            function renderAchievements(gamesCount, winsCount, score) {
                var grid = document.getElementById('achievementsGrid');
                var earned = [];
                if (gamesCount >= 1) earned.push('first_game');
                if (gamesCount >= 10) earned.push('10_games');
                if (gamesCount >= 100) earned.push('100_games');
                if (gamesCount >= 1000) earned.push('1000_games');
                if (winsCount >= 1) earned.push('first_win');
                if (winsCount >= 10) earned.push('10_wins');
                if (winsCount >= 100) earned.push('100_wins');
                if (winsCount >= 1000) earned.push('1000_wins');
                if (score >= 100) earned.push('100_score');
                if (score >= 1000) earned.push('1000_score');
                if (score >= 10000) earned.push('10000_score');
                if (score >= 100000) earned.push('100000_score');
                grid.innerHTML = allAchievements.map(function(a) {
                    var unlocked = earned.indexOf(a.id) !== -1;
                    return '<div class="achievement-item' + (unlocked ? '' : ' locked') + '"><span class="achievement-icon">' + a.icon + '</span><span class="achievement-name">' + getTranslation(a.name) + '</span></div>';
                }).join('');
            }

            async function loadProfile() {
                var myId = getUserId();
                
                var userData = await fetchData('getUser', {});
                if (userData.ok && userData.data) {
                    var d = userData.data;
                    currentAvatar = d.avatar || 'default';
                    document.getElementById('profileName').innerHTML = getUserTypeBadge(d.user_type) + ' ' + (d.name || 'کاربر');
                    document.getElementById('profileUsername').textContent = 'ID: ' + myId;
                    document.getElementById('totalScore').textContent = d.score || 0;
                    document.getElementById('scoreValue').textContent = d.score || 0;
                    updateProfileAvatar();
                    document.getElementById('headerLoader').style.display = 'none';
                    document.getElementById('headerCard').style.display = 'block';
                    document.getElementById('statsLoader').style.display = 'flex';
                }

                var gamesData = await fetchData('getGamesByPlayer', {});
                var totalGames = 0, totalWins = 0;
                
                if (gamesData.ok && Array.isArray(gamesData.data)) {
                    var myGames = gamesData.data.filter(function(g) {
                        return g.players && g.players.indexOf(myId) !== -1;
                    });
                    
                    var finishedGames = myGames.filter(function(g) { return g.status === 'finish'; });
                    
                    totalGames = finishedGames.length;
                    totalWins = 0;
                    
                    for (var wi = 0; wi < finishedGames.length; wi++) {
                        var gr = finishedGames[wi].final;
                        if (gr && gr.indexOf('city_won') !== -1) totalWins++;
                    }
                    
                    document.getElementById('totalGames').textContent = totalGames;
                    document.getElementById('totalWins').textContent = totalWins;
                    
                    var list = document.getElementById('gamesList');
                    
                    var recentGames = finishedGames.slice(-5).reverse();
                    
                    if (recentGames.length === 0) {
                        list.innerHTML = renderEmpty(getTranslation('no_games'));
                    } else {
                        var gamesHtml = '';
                        for (var gi = 0; gi < recentGames.length; gi++) {
                            var g = recentGames[gi];
                            var cls = 'loss', txt = getTranslation('lose');
                            
                            if (g.final && g.final.indexOf('city_won') !== -1) {
                                cls = 'win';
                                txt = getTranslation('win');
                            }
                            
                            gamesHtml += '<div class="game-item"><span class="game-players"><span class="game-avatar"><i class="fa-solid fa-users"></i></span> ' + g.id + '</span><span class="game-score ' + cls + '">' + txt + '</span></div>';
                        }
                        list.innerHTML = gamesHtml;
                    }
                    
                    document.getElementById('statsLoader').style.display = 'none';
                    document.getElementById('statsGrid').style.display = 'grid';
                    document.getElementById('achievementsLoader').style.display = 'flex';
                }

                setTimeout(function() {
                    document.getElementById('achievementsLoader').style.display = 'none';
                    document.getElementById('achievementsCard').style.display = 'block';
                    renderAchievements(totalGames, totalWins, userData.ok && userData.data ? userData.data.score || 0 : 0);
                    document.getElementById('historyLoader').style.display = 'flex';
                }, 800);

                setTimeout(function() {
                    document.getElementById('historyLoader').style.display = 'none';
                    document.getElementById('historyCard').style.display = 'block';
                }, 1200);
            }

            if (webApp) {
                webApp.ready();
                webApp.expand();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() { window.location.href = '../dashboard/'; });
            }

            applyTheme();
            loadProfile();
            setTimeout(function() {
                var notif = document.getElementById('supportNotification');
                if (notif) { notif.style.display = 'none'; }
            }, 5000);
        })();
