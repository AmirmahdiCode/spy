<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .header-currency { display: flex; align-items: center; gap: 6px; }
        .currency-badge {
            display: flex; align-items: center; gap: 4px;
            background: var(--bg2); border: var(--border); border-radius: 8px;
            padding: 4px 10px; font-size: 10px; font-weight: 700;
            color: var(--dark); box-shadow: 2px 2px 0 #000;
            min-width: 50px;
            justify-content: center;
        }
        .currency-badge.coins i { color: #f59e0b; }
        .currency-badge.diamonds i { color: #06b6d4; }
        .mini-spinner {
            width: 12px; height: 12px;
            border: 2px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        .main-container {
            position: relative; z-index: 5;
            max-width: 600px; width: 100%;
            margin: 16px auto; padding: 0 12px 90px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .profile-content { display: flex; flex-direction: column; gap: 12px; }

        .section-loader {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .section-loader-spinner {
            width: 30px;
            height: 30px;
            border: 4px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .section-loader-text {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-light);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
        }
        .profile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .profile-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: #fff; border: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--primary); overflow: hidden; flex-shrink: 0; cursor: pointer;
        }
        .profile-avatar:active { transform: scale(.95); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name {
            font-size: 14px; font-weight: 800; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 5px;
        }
        .profile-name .badge-icon {
            width: 16px; height: 16px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .profile-name .badge-icon img { width: 100%; height: 100%; object-fit: contain; }
        .profile-name .badge-icon i { font-size: 12px; color: #3b82f6; }
        .profile-username { font-size: 9px; color: rgba(255,255,255,.7); direction: ltr; text-align: right; }
        [dir="ltr"] .profile-username { text-align: left; }
        .profile-actions-row { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,.2); padding-top: 12px; }
        .change-avatar-btn {
            flex: 2; display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 8px; background: rgba(255,255,255,.2);
            border: 1px solid rgba(255,255,255,.4); border-radius: 8px;
            color: #fff; font-family: var(--font);
            font-size: 9px; font-weight: 700; cursor: pointer;
        }
        .badge {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
            background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px; padding: 10px 8px; font-size: 10px; font-weight: 700; color: #fff;
        }
        .badge .badge-value { font-size: 11px; font-weight: 800; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-card {
            background: var(--card-bg); border: var(--border); border-radius: var(--radius);
            padding: 16px; text-align: center; box-shadow: var(--shadow);
        }
        .stat-icon { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 800; color: var(--dark); }
        .stat-label { font-size: 8px; color: var(--text-light); }

        .achievements-card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .achievement-item {
            text-align: center; padding: 10px 4px; border: var(--border);
            border-radius: 8px; background: var(--bg2); box-shadow: 2px 2px 0 #000;
        }
        .achievement-icon { font-size: 20px; display: block; margin-bottom: 3px; }
        .achievement-name { font-size: 7px; font-weight: 700; color: var(--dark); }
        .achievement-item.locked { opacity: .3; filter: grayscale(1); }

        .games-history-card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .card-title {
            font-size: 13px; font-weight: 800; color: var(--dark); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 1px dashed var(--text-light); padding-bottom: 8px;
        }
        .card-title i { color: var(--primary); }
        .games-list { 
            display: flex; flex-direction: column; gap: 8px; max-height: 300px;
            overflow-y: auto; overflow-x: hidden; padding: 4px; margin: 0 -4px;
        }
        .game-item {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            border: var(--border); border-radius: 8px; background: var(--bg2); box-shadow: 2px 2px 0 #000;
            flex-shrink: 0;
        }
        .game-players { font-size: 9px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 4px; }
        .game-avatar {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--bg3); border: var(--border);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 10px; overflow: hidden; flex-shrink: 0;
        }
        .game-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .game-score { font-size: 9px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: var(--border); }
        .game-score.win { background: #10b981; color: #fff; }
        .game-score.loss { background: #ef4444; color: #fff; }

        .empty-state { text-align: center; padding: 16px; color: var(--text-light); font-size: 10px; }
        .empty-state i { font-size: 40px; color: var(--primary); margin-bottom: 8px; display: block; }

        .avatar-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.7); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .avatar-modal-overlay.show { display: flex; }
        .avatar-modal {
            background: var(--card-bg); border: var(--border); border-radius: var(--radius);
            padding: 16px; box-shadow: 5px 5px 0 #000;
            max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .avatar-modal-close {
            position: sticky; top: 0; float: left;
            width: 28px; height: 28px; border: var(--border); border-radius: 50%;
            background: var(--bg2); cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .avatar-modal-title { text-align: center; font-size: 14px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }
        .avatar-category { margin-bottom: 14px; }
        .avatar-category-title {
            font-size: 10px; font-weight: 800; color: var(--dark); margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .avatar-category-title .price-tag {
            font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            background: var(--bg2); border: var(--border); color: var(--dark);
        }
        .avatar-category-title .price-tag.free { background: #d1fae5; color: #059669; }
        .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .avatar-item {
            text-align: center; padding: 8px 4px; border: var(--border); border-radius: 8px;
            background: var(--bg2); cursor: pointer; transition: all .2s ease; box-shadow: 2px 2px 0 #000;
        }
        .avatar-item:active { transform: scale(.95); }
        .avatar-item.active { border-color: #f59e0b; border-width: 2px; }
        .avatar-item.owned { border-color: #10b981; }
        .avatar-item-img {
            width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 4px;
            background: #fff; border: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--primary); overflow: hidden;
        }
        .avatar-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-item-price { font-size: 7px; font-weight: 700; color: var(--text-light); }
        .avatar-item-price.free { color: #059669; }
        .avatar-item-price.owned { color: #10b981; }

        .support-notification {
            position: fixed; top: 75px; right: 5%; left: 5%;
            max-width: 400px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNotif { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .bottom-nav {
            position: fixed; bottom: 8px; right: 5%; left: 5%; width: 90%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 0; z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .bottom-nav {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            cursor: pointer; text-decoration: none; color: var(--text-light);
            padding: 4px 10px; font-family: var(--font); background: none; border: none; font-size: 12px;
        }
        .nav-item img {
            width: 20px; height: 20px;
            opacity: 0.5;
            filter: brightness(0);
        }
        [data-theme="dark"] .nav-item img {
            filter: brightness(0) invert(1);
        }
        .nav-item.active img {
            opacity: 1;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .nav-item span { font-size: 7px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        @media(max-width:480px) { .avatar-grid { grid-template-columns: repeat(4,1fr); } }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                </div>
            </div>
            <div class="header-currency">
                <span class="currency-badge coins"><i class="bi bi-coin" aria-hidden="true"></i> <span id="coinsHeader"><span class="mini-spinner"></span></span></span>
                <span class="currency-badge diamonds"><i class="bi bi-gem" aria-hidden="true"></i> <span id="diamondsHeader"><span class="mini-spinner"></span></span></span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="profile-content" id="profileContent">
            <div class="section-loader" id="headerLoader">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading">در حال دریافت اطلاعات...</div>
            </div>

            <div class="profile-header-card" id="headerCard" style="display:none;">
                <div class="profile-top">
                    <div class="profile-avatar" id="profileAvatar"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName"></div>
                        <div class="profile-username" id="profileUsername"></div>
                    </div>
                </div>
                <div class="profile-actions-row">
                    <button class="change-avatar-btn" id="btnChangeAvatar"><i class="bi bi-camera" aria-hidden="true"></i> <span data-i18n="change_avatar">تغییر آواتار</span></button>
                    <span class="badge"><i class="bi bi-star" aria-hidden="true"></i> <span class="badge-value" id="scoreValue">0</span></span>
                </div>
            </div>

            <div class="section-loader" id="statsLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_stats">در حال دریافت آمار...</div>
            </div>

            <div class="stats-grid" id="statsGrid" style="display:none;">
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-star" aria-hidden="true"></i></div>
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label" data-i18n="total_score">امتیاز کل</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-controller" aria-hidden="true"></i></div>
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label" data-i18n="total_games">تعداد بازی</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i></div>
                    <div class="stat-value" id="winRate">0%</div>
                    <div class="stat-label" data-i18n="win_rate">درصد برد</div>
                </div>
            </div>

            <div class="section-loader" id="achievementsLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_achievements">در حال دریافت افتخارات...</div>
            </div>

            <div class="achievements-card" id="achievementsCard" style="display:none;">
                <div class="card-title"><i class="bi bi-award" aria-hidden="true"></i> <span data-i18n="achievements">افتخارات</span></div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="section-loader" id="historyLoader" style="display:none;">
                <div class="section-loader-spinner"></div>
                <div class="section-loader-text" data-i18n="loading_history">در حال دریافت تاریخچه...</div>
            </div>

            <div class="games-history-card" id="historyCard" style="display:none;">
                <div class="card-title"><i class="bi bi-clock-history" aria-hidden="true"></i> <span data-i18n="game_history">تاریخچه بازی‌ها</span></div>
                <div class="games-list" id="gamesList"></div>
            </div>
        </div>
    </main>

    <div class="avatar-modal-overlay" id="avatarModalOverlay">
        <div class="avatar-modal">
            <div class="avatar-modal-close" id="btnCloseAvatarModal"><i class="bi bi-x-lg" aria-hidden="true"></i></div>
            <div class="avatar-modal-title" data-i18n="select_avatar">انتخاب آواتار</div>
            <div id="avatarCategories"></div>
        </div>
    </div>

    <div class="support-notification" id="supportNotification">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
        </div>
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" data-href="../dashboard/">
            <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="home">خانه</span>
        </div>
        <div class="nav-item" data-href="../ranking/">
            <img src="https://uploadkon.ir/uploads/8c9f29_26medal-1st-iconbase.svg" alt="رتبه" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
            <span data-i18n="ranking">رتبه</span>

            function getSettings() {
                try {
                    var raw = safeGetLocalStorage('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = safeParseJSON(raw, null);
                    if (!p || typeof p !== 'object') throw new Error('bad');
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {
                    return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                }
            }

                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });

                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                updateHeaderTitle(lang);
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 10000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

                if (iconAvatars[itemId]) return true;

                var html = '';

            async function selectAvatar(itemId) {
                if (!itemId || !VALID_AVATAR_ID.test(itemId)) return;

                var price = allAvatarPrices[itemId];
                if (price === undefined) return;

                var owned = isAvatarOwned(itemId);

                if (price === 0 || owned) {
                    var result = await fetchData('updateUser', { avatar: itemId });
                    if (result && result.ok) {
                        currentAvatar = itemId;
                        updateProfileAvatar();
                        closeAvatarModal();
                        triggerHaptic('light');
                    } else {
                        if (webApp && webApp.showAlert) webApp.showAlert(getTranslation('avatar_select_failed'));
                        else alert(getTranslation('avatar_select_failed'));
                    }
                    return;
                }

                if (userDiamonds < price) {
                    if (webApp && webApp.showAlert) webApp.showAlert(getTranslation('not_enough_diamonds'));
                    else alert(getTranslation('not_enough_diamonds'));
                    return;
                }

                var buyResult = await fetchData('buyAvatar', { avatarId: itemId });

                if (!buyResult || !buyResult.ok) {
                    var msg = buyResult && buyResult.error === 'Not enough diamonds'
                        ? getTranslation('not_enough_diamonds')
                        : getTranslation('avatar_buy_failed');
                    if (webApp && webApp.showAlert) webApp.showAlert(msg);
                    else alert(msg);
                    return;
                }

                if (buyResult.data) {
                    var newDiamonds = parseInt(buyResult.data.diamonds, 10);
                    if (!isNaN(newDiamonds)) {
                        userDiamonds = newDiamonds;
                        document.getElementById('diamondsHeader').textContent = String(newDiamonds);
                    }
                    if (Array.isArray(buyResult.data.owned_avatars)) {
                        setOwnedAvatars(buyResult.data.owned_avatars);
                    }
                }

                var selectResult = await fetchData('updateUser', { avatar: itemId });
                if (selectResult && selectResult.ok) {
                    currentAvatar = itemId;
                    updateProfileAvatar();
                    closeAvatarModal();
                    triggerHaptic('medium');
                    if (webApp && webApp.showAlert) webApp.showAlert(getTranslation('avatar_bought'));

                    else alert(getTranslation('avatar_bought'));
                }
            }

                if (gamesCount >= 1000) earned['1000_games'] = true;
                if (winsCount >= 1) earned['first_win'] = true;
                if (winsCount >= 10) earned['10_wins'] = true;
                if (winsCount >= 100) earned['100_wins'] = true;
                if (winsCount >= 1000) earned['1000_wins'] = true;
                if (score >= 100) earned['100_score'] = true;
                if (score >= 1000) earned['1000_score'] = true;
                if (score >= 10000) earned['10000_score'] = true;
                if (score >= 100000) earned['100000_score'] = true;

                grid.innerHTML = allAchievements.map(function(a) {
                    var unlocked = !!earned[a.id];
                    return '<div class="achievement-item' + (unlocked ? '' : ' locked') + '">' +
                        '<span class="achievement-icon">' + escapeHtml(a.icon) + '</span>' +
                        '<span class="achievement-name">' + escapeHtml(getTranslation(a.name)) + '</span>' +
                        '</div>';
                }).join('');
            }

            function didUserWinGame(game) {
                if (!game || !game.final) return false;
                var finalStr = String(game.final);
                var myTeam = game.my_team || game.myTeam || '';

                if (finalStr.indexOf('city_won') !== -1) {
                    if (myTeam === 'city' || myTeam === 'citizens') return true;
                    return false;
                }
                if (finalStr.indexOf('mafia_won') !== -1) {
                    if (myTeam === 'mafia') return true;
                    return false;
                }
                if (finalStr.indexOf('free_won') !== -1) {
                    if (myTeam === 'free') return true;
                    return false;
                }
                return false;
            }

            function renderGameHistory(finishedGames) {
                var list = document.getElementById('gamesList');
                var recent = finishedGames.slice(-5).reverse();

                if (recent.length === 0) {
                    list.innerHTML = renderEmpty(getTranslation('no_games'));
                    return;
                }

                var html = '';
                for (var i = 0; i < recent.length; i++) {
                    var g = recent[i];
                    var rawId = String(g.id == null ? '' : g.id);
                    var safeId = escapeHtml(rawId);
                    var didWin = didUserWinGame(g);
                    var cls = didWin ? 'win' : 'loss';
                    var txt = didWin ? getTranslation('win') : getTranslation('lose');
                    html += '<div class="game-item">' +
                        '<span class="game-players"><span class="game-avatar"><i class="fa-solid fa-users" aria-hidden="true"></i></span> ' + safeId + '</span>' +
                        '<span class="game-score ' + cls + '">' + escapeHtml(txt) + '</span>' +
                        '</div>';
                }
                list.innerHTML = html;
            }

            async function loadProfile() {
                myUserId = getUserId();

                var userData = await fetchData('getUser', {});

                if (userData && userData.ok && userData.data && typeof userData.data === 'object') {
                    var d = userData.data;
                    currentAvatar = typeof d.avatar === 'string' && VALID_AVATAR_ID.test(d.avatar) ? d.avatar : 'default';

                    if (Array.isArray(d.owned_avatars)) {
                        setOwnedAvatars(d.owned_avatars);
                    }

                    var dia = parseInt(d.diamonds, 10);
                    userDiamonds = isNaN(dia) ? 0 : dia;
                    var sc = parseInt(d.score, 10);
                    var score = isNaN(sc) ? 0 : sc;
                    var co = parseInt(d.coins, 10);
                    var coins = isNaN(co) ? 0 : co;

                    var nameEl = document.getElementById('profileName');
                    var safeName = escapeHtml(d.name || getTranslation('unknown_user'));
                    var badgeHtml = getUserTypeBadge(d.user_type);
                    nameEl.innerHTML = safeName + ' ' + badgeHtml;

                    document.getElementById('profileUsername').textContent = 'ID: ' + myUserId;
                    document.getElementById('totalScore').textContent = String(score);
                    document.getElementById('scoreValue').textContent = String(score);
                    document.getElementById('coinsHeader').textContent = String(coins);
                    document.getElementById('diamondsHeader').textContent = String(userDiamonds);
                    updateProfileAvatar();

                    document.getElementById('headerLoader').style.display = 'none';
                    document.getElementById('headerCard').style.display = 'block';
                    document.getElementById('statsLoader').style.display = 'flex';
                } else {
                    document.getElementById('headerLoader').style.display = 'none';
                    document.getElementById('headerCard').style.display = 'block';
                    document.getElementById('profileName').textContent = getTranslation('unknown_user');
                    document.getElementById('profileUsername').textContent = 'ID: ' + myUserId;
                    document.getElementById('coinsHeader').textContent = '0';
                    document.getElementById('diamondsHeader').textContent = '0';
                    updateProfileAvatar();
                    document.getElementById('statsLoader').style.display = 'flex';
                }

                var gamesData = await fetchData('getGamesByPlayer', {});
                var totalGames = 0;
                var totalWins = 0;
                var finishedGames = [];

                if (gamesData && gamesData.ok && Array.isArray(gamesData.data)) {
                    var myGames = gamesData.data.filter(function(g) {
                        return g && typeof g === 'object';
                    });

                    finishedGames = myGames.filter(function(g) { return g.status === 'finish'; });
                    totalGames = finishedGames.length;

                    for (var i = 0; i < finishedGames.length; i++) {
                        if (didUserWinGame(finishedGames[i])) totalWins++;
                    }

                    document.getElementById('totalGames').textContent = String(totalGames);
                    document.getElementById('winRate').textContent = totalGames > 0
                        ? Math.round((totalWins / totalGames) * 100) + '%'
                        : '0%';

                    renderGameHistory(finishedGames);

                    document.getElementById('statsLoader').style.display = 'none';
                    document.getElementById('statsGrid').style.display = 'grid';
                } else {
                    document.getElementById('totalGames').textContent = '0';
                    document.getElementById('winRate').textContent = '0%';
                    renderGameHistory([]);
                    document.getElementById('statsLoader').style.display = 'none';
                    document.getElementById('statsGrid').style.display = 'grid';
                }

                var finalScore = 0;
                if (userData && userData.ok && userData.data && userData.data.score) {
                    var pScore = parseInt(userData.data.score, 10);
                    finalScore = isNaN(pScore) ? 0 : pScore;
                }

                renderAchievements(totalGames, totalWins, finalScore);
                document.getElementById('achievementsCard').style.display = 'block';
                document.getElementById('historyCard').style.display = 'block';
            }

            document.getElementById('profileAvatar').addEventListener('click', openAvatarModal);
            document.getElementById('btnChangeAvatar').addEventListener('click', openAvatarModal);
            document.getElementById('btnCloseAvatarModal').addEventListener('click', closeAvatarModal);

            document.getElementById('avatarCategories').addEventListener('click', function(e) {
                var item = e.target.closest('.avatar-item');
                if (item && item.dataset.avatarId) {
                    selectAvatar(item.dataset.avatarId);
                }
            });
            document.getElementById('avatarCategories').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    var item = e.target.closest('.avatar-item');
                    if (item && item.dataset.avatarId) {
                        e.preventDefault();
                        selectAvatar(item.dataset.avatarId);
                    }
                }
            });

            document.getElementById('avatarModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeAvatarModal();
            });

            document.getElementById('supportNotification').addEventListener('click', openSupportLink);

            document.querySelectorAll('.nav-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var href = el.getAttribute('data-href');
                    if (href) window.location.href = href;
                });
            });

            if (webApp) {
                try {
                    webApp.ready();
                    webApp.expand();
                    if (webApp.BackButton && webApp.BackButton.show) {
                        webApp.BackButton.show();
                        webApp.BackButton.onClick(function() { window.location.href = '../dashboard/'; });
                    }
                } catch(e) {}
            }

            applyTheme();
            loadProfile();

            setTimeout(function() {
                var notif = document.getElementById('supportNotification');
                if (notif) notif.style.display = 'none';
            }, 5000);
        })();
    </script>
</body>
</html>
