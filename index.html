<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --font: 'Samim', Tahoma, sans-serif;
            --success: #10b981;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: flex-start; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .toast-container {
            position: fixed;
            top: 75px;
            right: 5%;
            left: 5%;
            max-width: 400px;
            margin: 0 auto;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #ef4444;
            color: #fff;
            border: 1px solid #b91c1c;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: toastIn 0.4s ease forwards;
        }
        .toast.hiding {
            animation: toastOut 0.4s ease forwards;
        }
        .toast i {
            font-size: 16px;
            flex-shrink: 0;
        }
        .toast .toast-text {
            flex: 1;
            line-height: 1.5;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        .support-bar {
            position: fixed;
            top: 78px;
            right: 5%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid var(--primary);
            border-radius: 25px;
            padding: 8px 16px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 2000;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.25s ease;
            overflow: hidden;
        }
        [data-theme="dark"] .support-bar {
            background: rgba(26, 26, 26, 0.35);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .support-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
            pointer-events: none;
            border-radius: 25px 25px 0 0;
        }
        [data-theme="dark"] .support-bar::before {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
        }
        .support-bar.show {
            display: flex;
            animation: supportIn 0.5s ease forwards;
        }
        .support-bar:active {
            transform: scale(0.98);
        }
        .support-bar span {
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            position: relative;
            z-index: 1;
        }
        .support-bar .channel-name {
            color: var(--primary);
            font-weight: 900;
            direction: ltr;
            display: inline-block;
            margin-right: 4px;
        }
        .support-bar i {
            color: var(--primary);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        @keyframes supportIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .main-container {
            position: relative; z-index: 5;
            flex: 1;
            max-width: 600px; width: 100%;
            margin: 0 auto;
            padding: 60px 24px 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .message-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.5;
            max-width: 400px;
            transition: opacity 0.4s ease;
        }
        .message-desc {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            line-height: 1.9;
            max-width: 380px;
            transition: opacity 0.4s ease;
        }

        .message-title.fading,
        .message-desc.fading {
            opacity: 0;
        }

        .blocked-contact {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 14px;
            background: var(--bg2);
            border: var(--border);
            border-radius: 10px;
            box-shadow: 2px 2px 0 #000;
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            direction: ltr;
            text-decoration: none;
        }
        .blocked-contact:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #000;
        }

        .progress-card {
            position: fixed;
            bottom: 12px;
            right: 5%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid var(--primary);
            border-radius: 20px;
            padding: 14px 16px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.4s ease;
        }
        [data-theme="dark"] .progress-card {
            background: rgba(26, 26, 26, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .progress-card.error {
            border-color: var(--danger);
        }
        .progress-card.error .progress-bar-fill {
            background: var(--danger);
        }
        .progress-card.error .progress-step-text {
            color: var(--danger);
        }
        .progress-card.error .progress-percent {
            color: var(--danger);
        }

        .progress-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .progress-icon {
            font-size: 14px;
            color: var(--primary);
            flex-shrink: 0;
            transition: color 0.3s ease;
        }
        .progress-card.error .progress-icon {
            color: var(--danger);
        }
        .progress-step-text {
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            flex: 1;
            text-align: right;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        [dir="ltr"] .progress-step-text { text-align: left; }
        .progress-step-text.fading { opacity: 0; }
        .progress-percent {
            font-size: 11px;
            font-weight: 900;
            color: var(--primary);
            min-width: 38px;
            text-align: left;
            direction: ltr;
            transition: color 0.3s ease;
        }

        .progress-bar-track {
            width: 100%;
            height: 8px;
            background: var(--bg3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] .progress-bar-track {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(.17,.67,.12,.99), background 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-card.error .progress-bar-fill::after {
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="toast-container" id="toastContainer"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                </div>
            </div>
        </div>
    </header>

    <div class="support-bar" id="supportBar">
        <i class="bi bi-heart-fill" aria-hidden="true"></i>
        <span data-i18n="support_text">حمایت از سازنده</span>
        <span class="channel-name">@amirmahdi_code</span>

    <main class="main-container">
        <h1 class="message-title" id="messageTitle" data-i18n="preparing_title">در حال آماده‌سازی...</h1>

    </main>

    <div class="progress-card" id="progressCard">
        <div class="progress-header">
            <i class="bi bi-hourglass-split progress-icon" id="progressIcon" aria-hidden="true"></i>
            <span class="progress-step-text" id="progressStepText">در حال آماده‌سازی...</span>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
    </div>

            var supportBar = document.getElementById('supportBar');
            var progressCard = document.getElementById('progressCard');
            var progressIcon = document.getElementById('progressIcon');

            var progressPercent = document.getElementById('progressPercent');
            var progressBarFill = document.getElementById('progressBarFill');

            var VALID_GAME_ID = /^[A-Za-z0-9_\-]{1,50}$/;
            var ERROR_REDIRECT_DELAY = 5000;
            var messageInterval = null;
            var isRedirecting = false;

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function safeGetLocalStorage(key) {
                try { return localStorage.getItem(key); }
                catch(e) { return null; }
            }

            function safeSetLocalStorage(key, value) {
                try { localStorage.setItem(key, value); return true; }
                catch(e) { return false; }
            }

            function safeParseJSON(str, fallback) {
                try {
                    var parsed = JSON.parse(str);
                    return parsed === null || parsed === undefined ? fallback : parsed;
                } catch(e) { return fallback; }
            }

            var fontMap = {

            function getTranslation(k) {
                var t = translations[currentLang] || translations.fa;
                return t[k] || translations.fa[k] || k;
            }

            function getSettings() {
                try {
                    var raw = safeGetLocalStorage('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = safeParseJSON(raw, null);
                    if (!p || typeof p !== 'object') throw new Error('bad');
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {
                    return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                }
            }

            function updateHeaderTitle(lang) {
                var titleEl = document.getElementById('headerTitle');
                if (!titleEl) return;
                titleEl.textContent = lang === 'en' ? 'Mafia Spy' : 'جاسوس مافیایی';
            }

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                updateHeaderTitle(lang);
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function showToast(message, duration) {
                duration = duration || 4000;
                var container = document.getElementById('toastContainer');
                if (!container) return;

                var toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span class="toast-text">' + escapeHtml(message) + '</span>';
                container.appendChild(toast);

                setTimeout(function() {
                    toast.classList.add('hiding');
                    setTimeout(function() {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 400);
                }, duration);
            }

            function setProgress(percent, stepKey, isError) {
                currentProgress = percent;
                progressBarFill.style.width = percent + '%';
                progressPercent.textContent = toPersianDigits(percent) + '%';

                if (stepKey) {
                    progressStepText.classList.add('fading');
                    setTimeout(function() {
                        progressStepText.textContent = getTranslation(stepKey);
                        progressStepText.classList.remove('fading');
                    }, 200);
                }

                if (isError) {
                    progressCard.classList.add('error');
                    progressIcon.className = 'bi bi-x-circle-fill progress-icon';
                } else {
                    progressCard.classList.remove('error');
                }
            }

            function toPersianDigits(n) {
                var s = String(n);
                if (currentLang === 'en') return s;
                var digits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                return s.replace(/\d/g, function(d) { return digits[parseInt(d, 10)]; });
            }

            var messages = {
                fa: [
                    { title: 'یک نفر میان شما جاسوس هست', desc: 'باید قبل از اینکه دیر بشه پیداش کنید. به حرف‌ها و رفتار بقیه دقیق باش.' },
                    { title: 'بپرس، بشناس، لو بده', desc: 'با سوال‌های هوشمندانه از پاسخ‌ها فاصله بگیر و جاسوس رو تشخیص بده.' },
                    { title: 'از شهر دفاع کن', desc: 'مافیا در کمین شهره. با هم متحد باشید تا شهر رو نجات بدید.' },
                    { title: 'حقیقت رو کشف کن', desc: 'با استدلال و منطق، بین راست و دروغ فرق بذار و جاسوس رو لو بده.' }
                ],
                en: [
                    { title: 'One of you is a spy', desc: 'You must find them before it\'s too late. Pay close attention to words and behavior.' },
                    { title: 'Ask, know, expose', desc: 'Use smart questions to distance from answers and identify the spy.' },
                    { title: 'Defend the city', desc: 'Mafia is lurking. Unite together to save the city.' },
                    { title: 'Discover the truth', desc: 'Use logic and reasoning to tell truth from lies and expose the spy.' }
                ],
                ar: [
                    { title: 'أحدكم جاسوس', desc: 'يجب أن تجدوه قبل فوات الأوان. كونوا منتبهين للكلام والسلوك.' },
                    { title: 'اسأل، اعرف، اكشف', desc: 'بأسئلة ذكية اقترب من الحقيقة وحدد الجاسوس.' },
                    { title: 'دافع عن المدينة', desc: 'المافيا تترصد. اتحدوا معاً لإنقاذ المدينة.' },
                    { title: 'اكتشف الحقيقة', desc: 'بمنطق واستدلال، ميّز بين الصدق والكذب واكشف الجاسوس.' }
                ]
            };

            var currentMsgIndex = 0;

            function getCurrentMessages() {
                return messages[currentLang] || messages.fa;
            }

            function showMessage(index) {
                if (isRedirecting) return;
                var msgs = getCurrentMessages();
                var msg = msgs[index % msgs.length];
                messageTitle.classList.add('fading');
                messageDesc.classList.add('fading');

                setTimeout(function() {
                    messageTitle.textContent = msg.title;
                    messageDesc.textContent = msg.desc;
                    messageTitle.classList.remove('fading');
                    messageDesc.classList.remove('fading');
                }, 400);
            }

            function startMessageRotation() {
                var msgs = getCurrentMessages();
                currentMsgIndex = 0;
                messageTitle.textContent = msgs[0].title;
                messageDesc.textContent = msgs[0].desc;

                messageInterval = setInterval(function() {
                    currentMsgIndex++;
                    showMessage(currentMsgIndex);
                }, 4000);
            }

            function stopMessageRotation() {
                if (messageInterval) {
                    clearInterval(messageInterval);
                    messageInterval = null;
                }
            }

            function showSupportBar() {
                supportBar.classList.add('show');
            }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;
            }

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            function getStartParam() {
                var param = '';
                try {
                    if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
                        param = String(webApp.initDataUnsafe.start_param);
                    }
                } catch(e) {}
                if (!param) {
                    try {
                        var urlParams = new URLSearchParams(window.location.search);
                        param = urlParams.get('startapp') || urlParams.get('start') || urlParams.get('room') || '';
                    } catch(e) {}
                }
                return String(param).trim();
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 10000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

            function goToDashboard() {
                isRedirecting = true;
                stopMessageRotation();
                window.location.href = './dashboard/';
            }

            function goToWaiting(gameId) {
                isRedirecting = true;
                stopMessageRotation();
                safeSetLocalStorage('mafiaRoomCode', gameId);
                window.location.href = './game/waiting/?room=' + encodeURIComponent(gameId);
            }

            function handleJoinError(errCode) {
                stopMessageRotation();
                var msg = getTranslation('err_join_failed');

                if (errCode === 'Game already started') msg = getTranslation('err_game_started');
                else if (errCode === 'Game is full') msg = getTranslation('err_game_full');
                else if (errCode === 'Active game exists') msg = getTranslation('err_active_game');
                else if (errCode === 'Game not found') msg = getTranslation('err_game_not_found');
                else if (errCode === 'You were kicked from this game') msg = getTranslation('err_kicked');
                else if (errCode === 'Game is finished' || errCode === 'Game finished') msg = getTranslation('err_game_finished');
                else if (errCode === 'Game is cancelled' || errCode === 'Game cancelled') msg = getTranslation('err_game_cancelled');
                else if (errCode === 'network') msg = getTranslation('err_network');

                setProgress(currentProgress, null, true);
                progressStepText.textContent = msg;
                progressStepText.classList.remove('fading');

                messageTitle.textContent = msg;
                messageDesc.textContent = getTranslation('blocked_desc');

                showToast(msg, 4500);

                setTimeout(function() {
                    goToDashboard();
                }, ERROR_REDIRECT_DELAY);
            }

            function handleBlocked() {
                stopMessageRotation();
                setProgress(100, null, true);
                progressStepText.textContent = getTranslation('step_blocked');

                messageTitle.textContent = getTranslation('blocked_title');
                messageDesc.innerHTML = escapeHtml(getTranslation('blocked_desc')) +
                    '<br><a class="blocked-contact" id="blockedContact" href="javascript:void(0);">' +
                    '<i class="bi bi-telegram" aria-hidden="true"></i> ' +
                    escapeHtml(getTranslation('blocked_contact')) +
                    '</a>';

                var contact = document.getElementById('blockedContact');
                if (contact) {
                    contact.addEventListener('click', function() {
                        openSupportProfile();
                    });
                }
            }

            function handleNotInEitaa() {
                stopMessageRotation();
                setProgress(100, null, true);
                progressStepText.textContent = getTranslation('not_in_eitaa_title');
                messageTitle.textContent = getTranslation('not_in_eitaa_title');
                messageDesc.textContent = getTranslation('not_in_eitaa_desc');
            }

            function openSupportProfile() {
                triggerHaptic('light');
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/mr_program');
                } else {
                    window.open('https://eitaa.com/mr_program', '_blank', 'noopener,noreferrer');
                }
            }

            function openChannelLink() {
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank', 'noopener,noreferrer');
                }
            }

            async function checkActiveGame() {
                try {
                    var result = await fetchData('getGamesByPlayer', {});

                    if (result && result.ok && Array.isArray(result.data)) {
                        for (var i = 0; i < result.data.length; i++) {
                            var g = result.data[i];
                            if (!g || typeof g !== 'object') continue;
                            var rawId = String(g.id == null ? '' : g.id);
                            if (!VALID_GAME_ID.test(rawId)) continue;
                            var s = g.status;
                            if (s === 'waiting' || s === 'd1' || s === 'n1' || s === 'd2' || s === 'n2' || s === 'd3' || s === 'n3') {
                                return { id: rawId, status: s };
                            }
                        }
                    }
                } catch(e) {}
                return null;
            }

            async function init() {
                applyTheme();
                startMessageRotation();
                setProgress(5, 'step_user_info');

                if (webApp) {
                    try {
                        webApp.ready();
                        webApp.expand();
                        if (webApp.BackButton && webApp.BackButton.hide) {
                            webApp.BackButton.hide();
                        }
                    } catch(e) {}
                }

                var startParam = getStartParam();
                var user = getEitaaUser();
                var username = getUserId();

                if (!user || !username) {
                    handleNotInEitaa();
                    return;
                }

                var fullName = ((user.first_name || '') + ' ' + (user.last_name || '')).trim() || getTranslation('preparing_title');

                setProgress(25, 'step_check_status');

                var check = await fetchData('getUser', {});

                if (check && check.ok && check.data && typeof check.data === 'object') {
                    var userType = String(check.data.user_type || '').trim();
                    if (userType.indexOf('متخلف') !== -1) {
                        handleBlocked();
                        return;
                    }

                    var currentName = String(check.data.name || '').trim();
                    if (currentName !== fullName) {
                        setProgress(45, 'step_update_info');
                        await fetchData('updateUser', { name: fullName });
                    }
                } else {
                    setProgress(45, 'step_register');
                    await fetchData('registerUser', { name: fullName });
                }

                showSupportBar();

                setProgress(60, 'step_check_active');

                if (startParam && VALID_GAME_ID.test(startParam)) {
                    var activeGame = await checkActiveGame();

                    if (activeGame && activeGame.id !== startParam) {
                        handleJoinError('Active game exists');
                        return;
                    }

                    setProgress(75, 'step_check_target');

                    var targetGame = await fetchData('getGame', { gameId: startParam });

                    if (!targetGame || !targetGame.ok || !targetGame.data) {
                        handleJoinError('Game not found');
                        return;
                    }

                    var gameStatus = String(targetGame.data.status || '');

                    if (gameStatus === 'finish' || gameStatus === 'finished') {
                        handleJoinError('Game is finished');
                        return;
                    }
                    if (gameStatus === 'cancelled') {
                        handleJoinError('Game is cancelled');
                        return;
                    }

                    if (activeGame && activeGame.id === startParam) {
                        setProgress(95, 'step_redirect_waiting');
                        goToWaiting(startParam);
                        return;
                    }

                    var players = Array.isArray(targetGame.data.players) ? targetGame.data.players : [];
                    var maxPlayers = parseInt(targetGame.data.playerCount, 10) || 0;

                    var kicked = false;
                    if (Array.isArray(targetGame.data.kicked_users)) {
                        for (var i = 0; i < targetGame.data.kicked_users.length; i++) {
                            if (String(targetGame.data.kicked_users[i]) === String(username)) {
                                kicked = true;
                                break;
                            }
                        }
                    }

                    if (kicked && gameStatus === 'waiting') {
                        handleJoinError('You were kicked from this game');
                        return;
                    }

                    if (gameStatus !== 'waiting') {
                        handleJoinError('Game already started');
                        return;
                    }

                    if (maxPlayers > 0 && players.length >= maxPlayers) {
                        handleJoinError('Game is full');
                        return;
                    }

                    setProgress(85, 'step_join_game');

                    var joinResult = await fetchData('joinGame', { gameId: startParam });

                    if (joinResult && joinResult.ok) {
                        setProgress(95, 'step_redirect_waiting');
                        goToWaiting(startParam);
                        return;
                    }

                    var errCode = joinResult ? String(joinResult.error || '') : '';
                    handleJoinError(errCode);
                    return;
                }

                setProgress(90, 'step_preparing');

                setTimeout(function() {
                    setProgress(100, 'step_redirect_dashboard');
                    setTimeout(function() {
                        goToDashboard();
                    }, 600);
                }, 500);
            }

            supportBar.addEventListener('click', openChannelLink);

            init();
        })();
    </script>
</body>
</html>
