<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاسوس مافیایی</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/gandom-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f5f5f5;
            --bg3: #e0e0e0;
            --primary: #000000;
            --primary-dark: #333333;
            --primary-light: #666666;
            --primary-rgb: 0, 0, 0;
            --dark: #000000;
            --text: #333333;
            --text-light: #999999;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --font: 'Samim', Tahoma, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #1a1a1a;
            --bg3: #333333;
            --primary: #666666;
            --primary-dark: #999999;
            --primary-light: #444444;
            --primary-rgb: 102, 102, 102;
            --dark: #ffffff;
            --text: #cccccc;
            --text-light: #888888;
            --white: #1a1a1a;
            --card-bg: #1a1a1a;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #666666;
        }

        [data-special-theme="crime"] {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fca5a5;
            --primary-rgb: 220, 38, 38;
            --border: 1px solid #dc2626;
        }

        [data-theme="dark"][data-special-theme="crime"] {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #fca5a5;
            --primary-rgb: 239, 68, 68;
            --border: 1px solid #ef4444;
        }

        [data-animation="off"] * { animation: none !important; transition: none !important; }

        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; user-drag: none;
        }
        img { pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; user-drag: none; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%); }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .header {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--primary);
        }

        .header-inner { display: flex; align-items: center; justify-content: center; max-width: 600px; margin: 0 auto; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .toast-container {
            position: fixed;
            top: 75px;
            right: 5%;
            left: 5%;
            max-width: 400px;
            margin: 0 auto;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #ef4444;
            color: #fff;
            border: 1px solid #b91c1c;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: toastIn 0.4s ease forwards;
        }
        .toast.hiding {
            animation: toastOut 0.4s ease forwards;
        }
        .toast i {
            font-size: 16px;
            flex-shrink: 0;
        }
        .toast .toast-text {
            flex: 1;
            line-height: 1.5;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        .support-notification {
            position: fixed;
            top: 75px;
            right: 5%;
            left: 5%;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 10px 14px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .support-notification {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .support-notification.show {
            display: flex;
            animation: supportIn 0.5s ease forwards;
        }
        .support-notification.hiding {
            animation: supportOut 0.5s ease forwards;
        }
        .support-notification img {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            object-fit: cover;
            flex-shrink: 0;
        }
        .support-notification .notif-info { flex: 1; min-width: 0; }
        .support-notification .notif-name {
            font-size: 10px;
            font-weight: 800;
            color: var(--dark);
        }
        .support-notification i {
            color: var(--text-light);
            font-size: 10px;
            flex-shrink: 0;
        }

        @keyframes supportIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes supportOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .main-container {
            position: relative; z-index: 5;
            flex: 1;
            max-width: 600px; width: 100%;
            margin: 0 auto;
            padding: 40px 24px 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .message-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.5;
            max-width: 400px;
            transition: opacity 0.4s ease;
            text-align: center;
        }
        .message-desc {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            line-height: 1.9;
            max-width: 380px;
            transition: opacity 0.4s ease;
            text-align: center;
        }

        [dir="ltr"] .message-title,
        [dir="ltr"] .message-desc {
            text-align: center;
        }

        .message-title.fading,
        .message-desc.fading {
            opacity: 0;
        }

        .user-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            animation: cardIn 0.5s ease forwards;
        }
        .user-card.show {
            display: flex;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-card-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-card-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            line-height: 1.4;
        }
        .user-card-name .badge-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .user-card-name .badge-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .user-card-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .user-card-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
        }
        .user-card-stat i {
            color: var(--primary);
            font-size: 13px;
        }
        .user-card-stat .stat-value {
            font-weight: 800;
        }

        .user-card-status {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 4px;
            line-height: 1.7;
        }

        .loading-footer {
            position: fixed;
            bottom: 8px;
            right: 5%;
            left: 5%;
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 25px;
            padding: 10px 16px;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .loading-footer {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
        }
        .progress-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-status {
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            color: var(--dark);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="toast-container" id="toastContainer"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/b255561_InShot_20260908_172945792.jpg" alt="Mafia Spy" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title" id="headerTitle">جاسوس مافیایی</div>
                </div>
            </div>
        </div>
    </header>

    <div class="support-notification" id="supportNotification">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
        </div>
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </div>

    <main class="main-container">
        <h1 class="message-title" id="messageTitle">در حال آماده‌سازی...</h1>
        <p class="message-desc" id="messageDesc">لطفاً چند لحظه صبر کنید</p>

        <div class="user-card" id="userCard">
            <div class="user-card-avatar" id="userCardAvatar"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
            <div class="user-card-name" id="userCardName"></div>
            <div class="user-card-stats" id="userCardStats"></div>
            <div class="user-card-status" id="userCardStatus"></div>
        </div>
    </main>

    <div class="loading-footer" id="loadingFooter">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-status" id="progressStatus">در حال آماده‌سازی...</div>
    </div>

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });

            document.addEventListener('cut', function(e) { e.preventDefault(); });

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function escapeAttr(str) { return escapeHtml(str); }

            function safeGetLocalStorage(key) {
                try { return localStorage.getItem(key); }
                catch(e) { return null; }
            }

            function safeSetLocalStorage(key, value) {
                try { localStorage.setItem(key, value); return true; }
                catch(e) { return false; }
            }

            function safeParseJSON(str, fallback) {
                try {
                    var parsed = JSON.parse(str);
                    return parsed === null || parsed === undefined ? fallback : parsed;
                } catch(e) { return fallback; }
            }

            var fontMap = {

                'pack1_1': 'https://cdn.imgurl.ir/uploads/w54346_lIQr-ezB9TyDFznBX3EieIvKLKM-CdpmSV-OSA2l26jhWCDcIA.png',

            function getTranslation(k) {
                var t = translations[currentLang] || translations.fa;
                return t[k] || translations.fa[k] || k;
            }

            function getSettings() {
                try {
                    var raw = safeGetLocalStorage('mafiaSettings');
                    if (!raw) return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                    var p = safeParseJSON(raw, null);
                    if (!p || typeof p !== 'object') throw new Error('bad');
                    if (!p.theme) p.theme = 'light';
                    if (!p.specialTheme) p.specialTheme = 'none';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.font) p.font = 'Samim';
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) {
                    return { theme: 'light', specialTheme: 'none', animation: true, haptic: true, font: 'Samim', language: 'fa' };
                }
            }

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var st = s.specialTheme || 'none';
                var f = s.font || 'Samim';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-special-theme', st);
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                var fontFamily = fontMap[f] || fontMap['Samim'];
                document.documentElement.style.setProperty('--font', fontFamily);
                document.body.style.fontFamily = fontFamily;
                applyLanguage(currentLang);
            }

            function applyLanguage(lang) {
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
            }

            function triggerHaptic(style) {
                var s = getSettings();
                if (s.haptic === false) return;
                if (webApp && webApp.HapticFeedback && webApp.HapticFeedback.impactOccurred) {
                    try { webApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
                }
            }

            function showToast(message, duration) {
                duration = duration || 4000;
                var container = document.getElementById('toastContainer');
                if (!container) return;

                var toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span class="toast-text">' + escapeHtml(message) + '</span>';
                container.appendChild(toast);

                setTimeout(function() {
                    toast.classList.add('hiding');
                    setTimeout(function() {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 400);
                }, duration);
            }

            function setProgress(pct, status) {
                if (progressBar) progressBar.style.width = pct + '%';
                if (status && progressStatus) progressStatus.textContent = status;
            }

            function getAvatarHtml(avatarId) {
                if (!avatarId || avatarId === 'default') return '<i class="fa-solid fa-user" aria-hidden="true"></i>';
                if (iconAvatars[avatarId]) return '<i class="fa-solid ' + escapeAttr(iconAvatars[avatarId]) + '" aria-hidden="true"></i>';
                if (allAvatarUrls[avatarId]) return '<img src="' + escapeAttr(allAvatarUrls[avatarId]) + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                return '<i class="fa-solid fa-user" aria-hidden="true"></i>';
            }

            function getUserTypeBadge(userType) {
                var t = String(userType || '').trim();
                if (!t) return '';

                var parts = t.split(',').map(function(s) { return s.trim(); });
                var html = '';

                for (var i = 0; i < parts.length; i++) {
                    var p = parts[i];
                    if (p === 'رسمی' || p === 'سازنده') {
                        html += '<span class="badge-icon"><img src="https://cdn.imgurl.ir/uploads/h95014_InShot_20260909_113952033.png" alt="رسمی" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></span>';
                    } else if (p === 'توسعه دهنده') {
                        html += '<span class="badge-icon"><img src="https://uploadkon.ir/uploads/b27b13_26laptop-iconbase.svg" alt="توسعه دهنده" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></span>';
                    } else if (p === 'پرومیوم') {
                        html += '<span class="badge-icon"><img src="https://uploadkon.ir/uploads/40e113_26premium-service-iconbase.svg" alt="پرومیوم" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></span>';
                    }
                }

                return html;
            }

            function showUserCard(userData, statusText) {
                messageTitle.style.display = 'none';
                messageDesc.style.display = 'none';

                userCardAvatar.innerHTML = getAvatarHtml(userData.avatar || 'default');
                var safeName = escapeHtml(userData.name || getTranslation('unknown_user'));
                var badgeHtml = getUserTypeBadge(userData.user_type);
                userCardName.innerHTML = safeName + ' ' + badgeHtml;

                var score = parseInt(userData.score, 10);
                var coins = parseInt(userData.coins, 10);
                var diamonds = parseInt(userData.diamonds, 10);
                if (isNaN(score)) score = 0;
                if (isNaN(coins)) coins = 0;
                if (isNaN(diamonds)) diamonds = 0;

                var statsHtml = '';
                statsHtml += '<div class="user-card-stat"><i class="bi bi-star-fill" aria-hidden="true"></i> <span class="stat-value">' + score + '</span> ' + escapeHtml(getTranslation('stat_score')) + '</div>';
                statsHtml += '<div class="user-card-stat"><i class="bi bi-coin" aria-hidden="true"></i> <span class="stat-value">' + coins + '</span> ' + escapeHtml(getTranslation('stat_coins')) + '</div>';
                statsHtml += '<div class="user-card-stat"><i class="bi bi-gem" aria-hidden="true"></i> <span class="stat-value">' + diamonds + '</span> ' + escapeHtml(getTranslation('stat_diamonds')) + '</div>';
                userCardStats.innerHTML = statsHtml;

                userCardStatus.textContent = statusText || '';
                userCard.classList.add('show');
            }

            function updateUserCardStatus(statusText) {
                if (userCardStatus) userCardStatus.textContent = statusText || '';
            }

            function showSupport() {
                supportNotification.classList.add('show');
                supportNotification.classList.remove('hiding');
            }

            function hideSupport() {
                supportNotification.classList.add('hiding');
                setTimeout(function() {
                    supportNotification.classList.remove('show');
                    supportNotification.classList.remove('hiding');
                }, 500);
            }

            function hideLoadingFooter() {
                if (loadingFooter) loadingFooter.style.display = 'none';
            }

            function getEitaaUser() {
                return webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;
            }

            function getUserId() {
                var u = getEitaaUser();
                if (!u || u.id === undefined || u.id === null) return '';
                return String(u.id);
            }

            function getStartParam() {
                var param = '';
                try {
                    if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
                        param = String(webApp.initDataUnsafe.start_param);
                    }
                } catch(e) {}
                if (!param) {
                    try {
                        var urlParams = new URLSearchParams(window.location.search);
                        param = urlParams.get('startapp') || urlParams.get('start') || urlParams.get('room') || '';
                    } catch(e) {}
                }
                return String(param).trim();
            }

            async function fetchData(action, params, retryCount) {
                retryCount = retryCount || 0;
                var payload = { action: action, username: getUserId() };
                if (params && typeof params === 'object') {
                    for (var k in params) {
                        if (Object.prototype.hasOwnProperty.call(params, k)) {
                            payload[k] = params[k];
                        }
                    }
                }
                try {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 10000);
                    var r = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!r.ok) throw new Error('http_' + r.status);

                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('application/json') === -1) {
                        throw new Error('invalid_content_type');
                    }

                    var data = await r.json();
                    if (!data || typeof data !== 'object') throw new Error('invalid_payload');
                    return data;
                } catch(err) {
                    var isRetryable = err && (
                        err.name === 'AbortError' ||
                        err.message === 'Failed to fetch' ||
                        err.message === 'NetworkError when attempting to fetch resource.' ||
                        err.message === 'invalid_content_type' ||
                        /^http_5/.test(err.message || '')
                    );
                    if (retryCount < 2 && isRetryable) {
                        await new Promise(function(res) { setTimeout(res, 1000 * (retryCount + 1)); });
                        return fetchData(action, params, retryCount + 1);
                    }
                    return { ok: false, error: 'network' };
                }
            }

            function goToDashboard() {
                isRedirecting = true;
                window.location.href = './dashboard/';
            }

            function goToWaiting(gameId) {
                isRedirecting = true;
                safeSetLocalStorage('mafiaRoomCode', gameId);
                window.location.href = './game/waiting/?room=' + encodeURIComponent(gameId);
            }

            function showToastAndRedirect(msgKey) {
                setProgress(100, getTranslation('loading_welcome'));
                showToast(getTranslation(msgKey), 4000);
                updateUserCardStatus(getTranslation('going_dashboard'));
                setTimeout(function() {
                    goToDashboard();
                }, 4300);
            }

            async function checkActiveGame() {
                try {
                    var result = await fetchData('getGamesByPlayer', {});

                    if (result && result.ok && Array.isArray(result.data)) {
                        for (var i = 0; i < result.data.length; i++) {
                            var g = result.data[i];
                            if (!g || typeof g !== 'object') continue;
                            var rawId = String(g.id == null ? '' : g.id);
                            if (!VALID_GAME_ID.test(rawId)) continue;
                            var s = g.status;
                            if (s === 'waiting' || s === 'd1' || s === 'n1' || s === 'd2' || s === 'n2' || s === 'd3' || s === 'n3') {
                                return { id: rawId, status: s };
                            }
                        }
                    }
                } catch(e) {}
                return null;
            }

            function openChannelLink() {
                hideSupport();
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank', 'noopener,noreferrer');
                }
            }

            function showBlockedMessage(titleKey, descKey) {
                if (userCard) userCard.classList.remove('show');
                messageTitle.style.display = '';
                messageDesc.style.display = '';
                messageTitle.textContent = getTranslation(titleKey);
                messageDesc.textContent = getTranslation(descKey);
                hideLoadingFooter();
            }

            async function init() {
                applyTheme();

                if (supportNotification) showSupport();

                supportTimer = setTimeout(function() {
                    hideSupport();
                }, 5000);

                setProgress(10, getTranslation('loading_start'));

                if (webApp) {
                    try {
                        webApp.ready();
                        webApp.expand();
                        if (webApp.BackButton && webApp.BackButton.hide) {
                            webApp.BackButton.hide();
                        }
                    } catch(e) {}
                }

                var startParam = getStartParam();
                var user = getEitaaUser();
                var username = getUserId();

                if (!user || !username) {
                    showBlockedMessage('no_itaa', 'no_itaa_desc');
                    return;
                }

                var fullName = ((user.first_name || '') + ' ' + (user.last_name || '')).trim() || getTranslation('unknown_user');

                setProgress(25, getTranslation('loading_user'));

                var check = await fetchData('getUser', {});
                var userData = null;

                if (check && check.ok && check.data && typeof check.data === 'object') {
                    userData = check.data;
                    var userType = String(check.data.user_type || '').trim();
                    if (userType.indexOf('متخلف') !== -1) {
                        showBlockedMessage('blocked', 'blocked_desc');
                        return;
                    }

                    var currentName = String(check.data.name || '').trim();
                    if (currentName !== fullName) {
                        await fetchData('updateUser', { name: fullName });
                        userData.name = fullName;
                    }
                } else {
                    setProgress(40, getTranslation('loading_register'));
                    var regResult = await fetchData('registerUser', { name: fullName });
                    userData = {
                        name: fullName,
                        avatar: 'default',
                        score: 0,
                        coins: 0,
                        diamonds: 0,
                        user_type: ''
                    };
                }

                setProgress(60, getTranslation('loading_ready'));

                showUserCard(userData, getTranslation('loading_ready'));

                if (startParam && VALID_GAME_ID.test(startParam)) {
                    setProgress(70, getTranslation('loading_check'));
                    updateUserCardStatus(getTranslation('loading_check'));

                    var activeGame = await checkActiveGame();

                    if (activeGame) {
                        if (activeGame.id === startParam) {
                            setProgress(100, getTranslation('loading_join'));
                            updateUserCardStatus(getTranslation('entering_game'));
                            setTimeout(function() {
                                goToWaiting(startParam);
                            }, 400);
                            return;
                        } else {
                            showToastAndRedirect('toast_has_active_game');
                            return;
                        }
                    }

                    setProgress(85, getTranslation('loading_join'));
                    updateUserCardStatus(getTranslation('loading_join'));

                    var joinResult = await fetchData('joinGame', { gameId: startParam });

                    if (joinResult && joinResult.ok) {
                        setProgress(100, getTranslation('loading_welcome'));
                        updateUserCardStatus(getTranslation('entering_game'));
                        setTimeout(function() {
                            goToWaiting(startParam);
                        }, 400);
                        return;
                    }

                    var errCode = joinResult ? String(joinResult.error || '') : '';

                    if (errCode === 'Game already started') {
                        showToastAndRedirect('toast_game_started');
                        return;
                    }
                    if (errCode === 'Game is full') {
                        showToastAndRedirect('toast_game_full');
                        return;
                    }
                    if (errCode === 'Active game exists') {
                        showToastAndRedirect('toast_has_active_game');
                        return;
                    }
                    if (errCode === 'Game not found') {
                        showToastAndRedirect('toast_game_started');
                        return;
                    }

                    showToastAndRedirect('toast_join_failed');
                    return;
                }

                setProgress(100, getTranslation('loading_welcome'));
                updateUserCardStatus(getTranslation('going_dashboard'));

                setTimeout(function() {
                    goToDashboard();
                }, 1200);
            }

            supportNotification.addEventListener('click', openChannelLink);

            init();
        })();
    </script>
</body>
</html>
